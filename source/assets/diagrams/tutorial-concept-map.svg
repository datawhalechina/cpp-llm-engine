<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">从零构建 C++ LLM 推理引擎</title>
  <desc id="desc">展示《从零构建 C++ LLM 推理引擎》从 GGUF、张量和解码器逐步进入分页 K/V 缓存、调度与推理服务，并扩展到单消费级 GPU、多模态输入和成熟框架对照。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#334155"/>
    </marker>
    <marker id="stage-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #475569; }
      .section { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .label { font-family: "Noto Sans CJK SC", sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #64748b; }
      .badge { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; }
      .card { stroke: #334155; stroke-width: 1.6; rx: 15; filter: url(#shadow); }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .stage-line { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#stage-arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="26" fill="url(#background)"/>
  <circle cx="1175" cy="58" r="115" fill="#bfdbfe" opacity="0.28"/>
  <circle cx="88" cy="715" r="135" fill="#bbf7d0" opacity="0.28"/>

  <text x="48" y="48" class="title">从零构建 C++ LLM 推理引擎</text>
  <text x="48" y="76" class="subtitle">从 GGUF、张量与解码器，到分页 K/V 缓存、调度与推理服务</text>

  <rect x="925" y="34" width="92" height="28" rx="14" fill="#dcfce7"/>
  <text x="971" y="53" text-anchor="middle" class="badge" fill="#166534">CPU 完整</text>
  <rect x="1028" y="34" width="98" height="28" rx="14" fill="#dbeafe"/>
  <text x="1077" y="53" text-anchor="middle" class="badge" fill="#1d4ed8">GPU 可选</text>
  <rect x="1137" y="34" width="96" height="28" rx="14" fill="#fef3c7"/>
  <text x="1185" y="53" text-anchor="middle" class="badge" fill="#92400e">中文优先</text>

  <text x="48" y="116" class="section">学习主线 · 每一阶段都有可运行产物</text>

  <rect x="48" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="112" y="170" text-anchor="middle" class="label">起点与基线</text>
  <text x="112" y="197" text-anchor="middle" class="small">基础练习 · 第 00 章</text>
  <text x="112" y="220" text-anchor="middle" class="tiny">工具链 · llama.cpp</text>

  <rect x="198" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="262" y="170" text-anchor="middle" class="label">输入与对象</text>
  <text x="262" y="197" text-anchor="middle" class="small">第 01–02 章</text>
  <text x="262" y="220" text-anchor="middle" class="tiny">GGUF · 张量</text>

  <rect x="348" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="412" y="170" text-anchor="middle" class="label">计算与结构</text>
  <text x="412" y="197" text-anchor="middle" class="small">第 03–04 章</text>
  <text x="412" y="220" text-anchor="middle" class="tiny">后端 · 解码器</text>

  <rect x="498" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="562" y="170" text-anchor="middle" class="label">量化与生成</text>
  <text x="562" y="197" text-anchor="middle" class="small">第 05–06 章</text>
  <text x="562" y="220" text-anchor="middle" class="tiny">量化权重 · 请求</text>

  <rect x="648" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="712" y="170" text-anchor="middle" class="label">分页缓存</text>
  <text x="712" y="197" text-anchor="middle" class="small">第 07 章</text>
  <text x="712" y="220" text-anchor="middle" class="tiny">块表 · K/V</text>

  <rect x="798" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="862" y="170" text-anchor="middle" class="label">请求调度</text>
  <text x="862" y="197" text-anchor="middle" class="small">第 08 章</text>
  <text x="862" y="220" text-anchor="middle" class="tiny">优先级 · 批处理</text>

  <rect x="948" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="1012" y="170" text-anchor="middle" class="label">性能证据</text>
  <text x="1012" y="197" text-anchor="middle" class="small">第 09 章</text>
  <text x="1012" y="220" text-anchor="middle" class="tiny">基准测试 · 性能剖析</text>

  <rect x="1098" y="138" width="128" height="104" class="card" fill="#ffffff"/>
  <text x="1162" y="170" text-anchor="middle" class="label">推理服务</text>
  <text x="1162" y="197" text-anchor="middle" class="small">第 10 章</text>
  <text x="1162" y="220" text-anchor="middle" class="tiny">服务核心 · HTTP</text>

  <path d="M176 190 H198" class="stage-line"/>
  <path d="M326 190 H348" class="stage-line"/>
  <path d="M476 190 H498" class="stage-line"/>
  <path d="M626 190 H648" class="stage-line"/>
  <path d="M776 190 H798" class="stage-line"/>
  <path d="M926 190 H948" class="stage-line"/>
  <path d="M1076 190 H1098" class="stage-line"/>

  <text x="48" y="296" class="section">三条横向观察线 · 数据进入计算，计算进入持续运行的系统</text>

  <rect x="100" y="318" width="260" height="92" class="card" fill="#fef3c7"/>
  <text x="230" y="351" text-anchor="middle" class="label">数据层</text>
  <text x="230" y="378" text-anchor="middle" class="small">模型 · 张量 / 视图 · 上下文</text>
  <text x="230" y="398" text-anchor="middle" class="tiny">形状、布局、所有权与请求状态</text>

  <rect x="500" y="318" width="280" height="92" class="card" fill="#dbeafe"/>
  <text x="640" y="351" text-anchor="middle" class="label">算子层</text>
  <text x="640" y="378" text-anchor="middle" class="small">算子 · 后端 · 解码器</text>
  <text x="640" y="398" text-anchor="middle" class="tiny">CPU / CUDA 实现同一数值语义</text>

  <rect x="920" y="318" width="260" height="92" class="card" fill="#dcfce7"/>
  <text x="1050" y="351" text-anchor="middle" class="label">系统层</text>
  <text x="1050" y="378" text-anchor="middle" class="small">运行时 · 调度器 · 服务核心</text>
  <text x="1050" y="398" text-anchor="middle" class="tiny">资源、测量、HTTP / SSE 与终态回收</text>

  <path d="M360 364 H495" class="line"/>
  <path d="M780 364 H915" class="line"/>

  <text x="48" y="464" class="section">能力扩展 · 不复制主线，只替换输入或执行后端</text>

  <rect x="48" y="486" width="365" height="120" class="card" fill="#fef3c7"/>
  <text x="70" y="518" class="label">SmolVLM 多模态 CPU 扩展</text>
  <text x="70" y="545" class="small">动态切图 · 视觉编码器 · 投影层</text>
  <text x="70" y="568" class="small">图文嵌入 · 解码器 · 服务核心</text>
  <text x="70" y="591" class="tiny">真实图片、同步/流式输出与性能基线已闭环</text>
  <path d="M230 410 V481" class="dash"/>

  <rect x="458" y="486" width="365" height="120" class="card" fill="#dbeafe"/>
  <text x="480" y="518" class="label">CUDA 执行扩展</text>
  <text x="480" y="545" class="small">设备 / 流 · cuBLAS · Q4_K/Q6_K 线性层</text>
  <text x="480" y="568" class="small">RoPE · 连续 K/V · GQA · 合成解码器</text>
  <text x="480" y="591" class="tiny">下一里程碑：真实 TinyLlama GPU 解码器</text>
  <path d="M640 410 V481" class="dash"/>

  <rect x="868" y="486" width="364" height="120" class="card" fill="#f1f5f9"/>
  <text x="890" y="518" class="label">成熟框架工程对照</text>
  <text x="890" y="545" class="small">llama.cpp · Tiny-VLLM · nano-vLLM</text>
  <text x="890" y="568" class="small">vLLM · SGLang · TensorRT-LLM · DeepInfer</text>
  <text x="890" y="591" class="tiny">真实基线、算法骨架与生产工程坐标</text>
  <path d="M1050 410 V481" class="dash"/>

  <text x="48" y="658" class="section">教学证据链</text>
  <rect x="48" y="676" width="1184" height="48" rx="24" fill="#0f172a"/>
  <text x="166" y="706" text-anchor="middle" class="badge" fill="#f8fafc">算法与数据契约</text>
  <text x="410" y="706" text-anchor="middle" class="badge" fill="#bfdbfe">C++ 可运行实现</text>
  <text x="650" y="706" text-anchor="middle" class="badge" fill="#bbf7d0">CTest / 数值基准</text>
  <text x="884" y="706" text-anchor="middle" class="badge" fill="#fde68a">基准测试 / 性能剖析</text>
  <text x="1100" y="706" text-anchor="middle" class="badge" fill="#fbcfe8">框架源码坐标</text>
  <path d="M268 700 H310 M510 700 H552 M750 700 H792 M984 700 H1026" stroke="#94a3b8" stroke-width="2"/>
</svg>
