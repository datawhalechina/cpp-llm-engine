  <text x="1162" y="170" text-anchor="middle" class="label">推理服务</text>
  <text x="1162" y="197" text-anchor="middle" class="small">Chapter10</text>
  <text x="1162" y="220" text-anchor="middle" class="tiny">ServiceCore · HTTP</text>

