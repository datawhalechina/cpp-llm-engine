<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">从零构建 C++ LLM 推理引擎</title>
  <desc id="desc">展示《从零构建 C++ LLM 推理引擎》从 GGUF、Tensor 和 Decoder 逐步进入 KV Cache、调度与推理服务，并扩展到单消费级 GPU、多模态输入和成熟框架对照。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #475569; }
      .section { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .label { font-family: "Noto Sans CJK SC", sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #64748b; }
      .badge { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; }
      .card { stroke: #334155; stroke-width: 1.6; rx: 15; filter: url(#shadow); }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="26" fill="url(#background)"/>
  <circle cx="1175" cy="58" r="115" fill="#bfdbfe" opacity="0.28"/>
  <circle cx="88" cy="715" r="135" fill="#bbf7d0" opacity="0.28"/>

  <text x="48" y="48" class="title">从零构建 C++ LLM 推理引擎</text>
  <text x="48" y="76" class="subtitle">从 GGUF、Tensor、Decoder 到 KV Cache、调度与推理服务</text>

  <rect x="925" y="34" width="92" height="28" rx="14" fill="#dcfce7"/>
  <text x="971" y="53" text-anchor="middle" class="badge" fill="#166534">CPU 完整</text>
  <rect x="1028" y="34" width="98" height="28" rx="14" fill="#dbeafe"/>
  <text x="1077" y="53" text-anchor="middle" class="badge" fill="#1d4ed8">GPU 可选</text>
  <rect x="1137" y="34" width="96" height="28" rx="14" fill="#fef3c7"/>
  <text x="1185" y="53" text-anchor="middle" class="badge" fill="#92400e">中文优先</text>

