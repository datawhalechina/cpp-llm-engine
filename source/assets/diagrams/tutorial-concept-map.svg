  <text x="640" y="351" text-anchor="middle" class="label">算子层</text>
  <text x="640" y="378" text-anchor="middle" class="small">Operator · Backend · Decoder</text>
  <text x="640" y="398" text-anchor="middle" class="tiny">CPU / CUDA 实现同一数值语义</text>

  <rect x="920" y="318" width="260" height="92" class="card" fill="#dcfce7"/>
  <text x="1050" y="351" text-anchor="middle" class="label">系统层</text>
  <text x="1050" y="378" text-anchor="middle" class="small">Runtime · Scheduler · ServiceCore</text>
  <text x="1050" y="398" text-anchor="middle" class="tiny">资源、测量、HTTP / SSE 与终态回收</text>

  <path d="M360 364 H495" class="line"/>
  <path d="M780 364 H915" class="line"/>

  <text x="48" y="464" class="section">能力扩展 · 不复制主线，只替换输入或执行后端</text>

  <rect x="48" y="486" width="365" height="120" class="card" fill="#fef3c7"/>
  <text x="70" y="518" class="label">SmolVLM 多模态 CPU 扩展</text>
  <text x="70" y="545" class="small">动态切图 · Vision Encoder · Projector</text>
  <text x="70" y="568" class="small">图文 Embedding · Decoder · ServiceCore</text>
  <text x="70" y="591" class="tiny">真实图片、同步/SSE 与 profiling golden 已闭环</text>
  <path d="M230 410 V481" class="dash"/>

  <rect x="458" y="486" width="365" height="120" class="card" fill="#dbeafe"/>
  <text x="480" y="518" class="label">CUDA 执行扩展</text>
  <text x="480" y="545" class="small">Device / Stream · cuBLAS · Q4_K/Q6_K Linear</text>
  <text x="480" y="568" class="small">RoPE · 连续 KV · GQA · 合成 Decoder</text>
