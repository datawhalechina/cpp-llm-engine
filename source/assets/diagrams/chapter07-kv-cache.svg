<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 07 分页 K/V 缓存</title>
  <desc id="desc">Chapter 07 位于单请求生成和多请求调度之间。逻辑词元经过块表定位物理槽位，分页数据面保存每层 K/V，Attention 按页读取，缓存事务负责预留、提交、回滚和释放。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#eef5f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#087f5b"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a24" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="56" y="54" font-size="27" font-weight="700" fill="#172033">Chapter 07：管理可分页的 K/V 与物理内存</text>
  <text x="56" y="83" font-size="15" fill="#52606d">保持 Attention 语义不变，把连续序列映射到可分配、可回收的物理块</text>

  <rect x="56" y="110" width="1088" height="116" rx="18" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="80" y="140" font-size="15" font-weight="700" fill="#52606d">在教程主线中的位置</text>
  <g text-anchor="middle">
    <rect x="104" y="160" width="248" height="46" rx="12" fill="#e8f1f6" stroke="#a9c3d2"/>
    <text x="228" y="180" font-size="14" font-weight="700" fill="#315d72">Chapter 06</text>
    <text x="228" y="198" font-size="12" fill="#526b78">单请求生成语义</text>
    <rect x="476" y="151" width="248" height="64" rx="14" fill="#087f5b" filter="url(#shadow)"/>
    <text x="600" y="178" font-size="16" font-weight="700" fill="#ffffff">Chapter 07</text>
    <text x="600" y="199" font-size="13" fill="#d9fff1">KV Cache · Memory</text>
    <rect x="848" y="160" width="248" height="46" rx="12" fill="#fff1df" stroke="#efc38e"/>
    <text x="972" y="180" font-size="14" font-weight="700" fill="#92511b">Chapter 08</text>
    <text x="972" y="198" font-size="12" fill="#7b5b3f">多请求调度与批处理</text>
  </g>
  <path d="M352 183 H476" fill="none" stroke="#52606d" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M724 183 H848" fill="none" stroke="#52606d" stroke-width="2.3" marker-end="url(#arrow)"/>

  <text x="56" y="270" font-size="18" font-weight="700" fill="#172033">从逻辑位置到 Attention 读取</text>
  <g text-anchor="middle">
    <rect x="56" y="300" width="196" height="96" rx="14" fill="#ffffff" stroke="#9ab6c4" stroke-width="2"/>
    <text x="154" y="330" font-size="15" font-weight="700" fill="#315d72">逻辑词元</text>
    <text x="154" y="355" font-size="13" fill="#52606d">位置 0 · 1 · 2 · 3</text>
    <text x="154" y="377" font-size="11" fill="#7b8b93">连续序列视图</text>

    <rect x="300" y="292" width="196" height="112" rx="15" fill="#fff1df" stroke="#d8893b" stroke-width="2"/>
    <text x="398" y="322" font-size="15" font-weight="700" fill="#92511b">BlockTable</text>
    <text x="398" y="347" font-size="12" fill="#715238">逻辑块 → 物理块</text>
    <text x="398" y="370" font-size="12" fill="#715238">位置 → 块内槽位</text>
    <text x="398" y="391" font-size="11" fill="#8b6b50">控制面</text>

    <rect x="544" y="292" width="244" height="112" rx="15" fill="#087f5b" filter="url(#shadow)"/>
    <text x="666" y="322" font-size="15" font-weight="700" fill="#ffffff">分页 K/V 数据面</text>
    <text x="666" y="347" font-size="12" fill="#d9fff1">层 · 物理块 · 槽位</text>
    <text x="666" y="370" font-size="12" fill="#d9fff1">KV 头 · 向量维度</text>
    <text x="666" y="391" font-size="11" fill="#bcebd9">真实 key / value</text>

    <rect x="836" y="300" width="196" height="96" rx="14" fill="#e8f1f6" stroke="#6697ad" stroke-width="2"/>
    <text x="934" y="330" font-size="15" font-weight="700" fill="#315d72">分页 Attention</text>
    <text x="934" y="355" font-size="13" fill="#52606d">按页读取历史 K/V</text>
    <text x="934" y="377" font-size="11" fill="#7b8b93">不拼回连续数组</text>

    <rect x="1068" y="312" width="76" height="72" rx="12" fill="#ffffff" stroke="#9ab6c4" stroke-width="2"/>
    <text x="1106" y="342" font-size="14" font-weight="700" fill="#315d72">输出</text>
    <text x="1106" y="365" font-size="11" fill="#7b8b93">向量</text>
  </g>
  <path d="M252 348 H300" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M496 348 H544" fill="none" stroke="#087f5b" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path d="M788 348 H836" fill="none" stroke="#087f5b" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path d="M1032 348 H1068" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="56" y="452" width="1088" height="116" rx="16" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="80" y="482" font-size="14" font-weight="700" fill="#52606d">缓存事务</text>
  <g text-anchor="middle">
    <rect x="104" y="506" width="140" height="40" rx="10" fill="#e8f1f6" stroke="#a9c3d2"/><text x="174" y="531" font-size="13" fill="#315d72">预留槽位</text>
    <rect x="302" y="506" width="140" height="40" rx="10" fill="#def4eb" stroke="#87c9ad"/><text x="372" y="531" font-size="13" fill="#076449">逐层写入</text>
    <path d="M500 526 L536 498 L572 526 L536 554 Z" fill="#ffffff" stroke="#9ab6c4" stroke-width="2"/>
    <text x="536" y="531" font-size="12" fill="#315d72">结果</text>
    <rect x="642" y="486" width="140" height="34" rx="9" fill="#087f5b"/><text x="712" y="508" font-size="13" fill="#ffffff">成功：提交可读</text>
    <rect x="642" y="532" width="140" height="34" rx="9" fill="#fff1df" stroke="#efc38e"/><text x="712" y="554" font-size="13" fill="#92511b">失败：回滚预留</text>
    <rect x="936" y="506" width="140" height="40" rx="10" fill="#e8f1f6" stroke="#a9c3d2"/><text x="1006" y="531" font-size="13" fill="#315d72">终态统一释放</text>
  </g>
  <path d="M244 526 H302" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M442 526 H500" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M556 510 V503 H642" fill="none" stroke="#087f5b" stroke-width="2" marker-end="url(#arrow-main)"/>
  <path d="M556 542 V549 H642" fill="none" stroke="#d8893b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M782 503 H858 V518 H936" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M782 549 H858 V534 H936" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="56" y="590" width="1088" height="32" rx="10" fill="#173f35"/>
  <text x="600" y="612" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">本章产物：独立于调度策略的 K/V 寻址、数据与生命周期契约</text>
</svg>
