<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">真实文本生成的数据链</title>
  <desc id="desc">输入文本经过分词器成为词元编号，TinyLlama Decoder 计算候选分数，贪心选择产生新词元；Chapter01、04、05、06 分别展开这些阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      .title { font: 700 24px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .label { font: 700 15px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .term { font: 400 12px "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .chapter { font: 700 14px "Noto Sans CJK SC", sans-serif; fill: #1e3a5f; }
      .chapter-note { font: 400 12px "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .learn { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" rx="20" fill="#f8fafc"/>
  <text x="40" y="45" class="title">一次真实生成：文字怎样变成新词元</text>
  <g text-anchor="middle">
    <rect x="35" y="105" width="125" height="72" rx="11" fill="#e2e8f0"/><text x="97" y="135" class="label">输入文本</text><text x="97" y="157" class="term">prompt</text>
    <rect x="190" y="105" width="130" height="72" rx="11" fill="#dbeafe"/><text x="255" y="135" class="label">分词器</text><text x="255" y="157" class="term">tokenizer</text>
    <rect x="350" y="105" width="120" height="72" rx="11" fill="#dbeafe"/><text x="410" y="135" class="label">词元编号</text><text x="410" y="157" class="term">token ID</text>
    <rect x="500" y="95" width="170" height="92" rx="12" fill="#bfdbfe"/><text x="585" y="130" class="label">模型解码器</text><text x="585" y="152" class="term">TinyLlama Decoder</text><text x="585" y="171" class="term">读取权重与历史状态</text>
    <rect x="700" y="105" width="120" height="72" rx="11" fill="#fef3c7"/><text x="760" y="135" class="label">候选分数</text><text x="760" y="157" class="term">logits</text>
    <rect x="850" y="105" width="140" height="72" rx="11" fill="#fde68a"/><text x="920" y="135" class="label">贪心选择</text><text x="920" y="157" class="term">greedy sampling</text>
    <rect x="1020" y="105" width="145" height="72" rx="11" fill="#fed7aa"/><text x="1092" y="135" class="label">生成词元</text><text x="1092" y="157" class="term">generated token</text>
  </g>
  <path d="M160 141H190M320 141H350M470 141H500M670 141H700M820 141H850M990 141H1020" class="flow"/>
  <g text-anchor="middle">
    <rect x="105" y="285" width="235" height="76" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="222" y="314" class="chapter">Chapter01</text><text x="222" y="337" class="chapter-note">Tokenizer、GGUF、配置与权重</text>
    <rect x="390" y="285" width="185" height="76" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="482" y="314" class="chapter">Chapter04</text><text x="482" y="337" class="chapter-note">Decoder、Attention 与 FFN</text>
    <rect x="625" y="285" width="185" height="76" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="717" y="314" class="chapter">Chapter05</text><text x="717" y="337" class="chapter-note">低比特权重与量化 Linear</text>
    <rect x="860" y="285" width="225" height="76" rx="11" fill="#f0fdf4" stroke="#86efac"/><text x="972" y="314" class="chapter">Chapter06</text><text x="972" y="337" class="chapter-note">采样、生成循环与请求状态</text>
  </g>
  <path d="M222 285V245L255 177" class="learn"/>
  <path d="M482 285V245L570 187" class="learn"/>
  <path d="M717 285V245L620 187" class="learn"/>
  <path d="M972 285V245L920 177" class="learn"/>
</svg>
