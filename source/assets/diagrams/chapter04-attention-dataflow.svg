<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">多头注意力的形状、因果掩码与预填充解码数据流</title>
  <desc id="desc">输入经过 Q K V 投影和注意力头拆分，计算缩放点积、因果遮罩、稳定 Softmax 和 Value 聚合；下方对比预填充与带位置偏移的逐词元解码。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .heading { font-size: 27px; font-weight: 700; fill: #172033; }
      .section { font-size: 16px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-sub { font-size: 12px; fill: #52606d; }
      .note { font-size: 13px; fill: #52606d; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 2.2; marker-end: url(#arrow); }
      .orange-arrow { fill: none; stroke: #c45b16; stroke-width: 2.4; marker-end: url(#arrow-orange); }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c45b16"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="52" y="55" class="heading">多头注意力：沿形状追踪一次计算</text>
  <text x="52" y="84" class="note">先看数据怎样流动，再区分预填充与复用已有 K/V 的逐词元解码</text>

  <rect x="52" y="112" width="1096" height="276" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="76" y="143" class="section">共同计算路径</text>

  <g text-anchor="middle">
    <rect x="76" y="178" width="126" height="72" rx="13" fill="#e8f1f7" stroke="#7aa6bc"/>
    <text x="139" y="207" class="node-title" fill="#28536b">输入隐藏状态</text>
    <text x="139" y="230" class="node-sub">X [T,D]</text>

    <rect x="237" y="170" width="150" height="88" rx="14" fill="#fff0dc" stroke="#e8a765"/>
    <text x="312" y="202" class="node-title" fill="#9a4d13">Q / K / V 投影</text>
    <text x="312" y="225" class="node-sub">三次 Linear</text>
    <text x="312" y="244" class="node-sub">[T,D]</text>

    <rect x="422" y="170" width="150" height="88" rx="14" fill="#fff0dc" stroke="#e8a765"/>
    <text x="497" y="202" class="node-title" fill="#9a4d13">按注意力头拆分</text>
    <text x="497" y="225" class="node-sub">词元优先布局（token-major）</text>
    <text x="497" y="244" class="node-sub">[T,H,Dh]</text>

    <rect x="607" y="170" width="150" height="88" rx="14" fill="#fee2d5" stroke="#d9773f"/>
    <text x="682" y="202" class="node-title" fill="#9a3412">缩放点积</text>
    <text x="682" y="225" class="node-sub">Q @ Kᵀ / √Dh</text>
    <text x="682" y="244" class="node-sub">分数 [T,H,T]</text>

    <rect x="792" y="162" width="150" height="104" rx="14" fill="#c45b16" filter="url(#shadow)"/>
    <text x="867" y="198" class="node-title" fill="#ffffff">因果遮罩</text>
    <text x="867" y="222" font-size="13" fill="#fff2e8">+ 稳定 Softmax</text>
    <text x="867" y="246" font-size="12" fill="#ffe0ca">权重 [T,H,T]</text>

    <rect x="977" y="170" width="147" height="88" rx="14" fill="#e7f6f3" stroke="#4a9d93"/>
    <text x="1050" y="202" class="node-title" fill="#0f5f59">聚合并输出</text>
    <text x="1050" y="225" class="node-sub">权重 @ V · 合并注意力头</text>
    <text x="1050" y="244" class="node-sub">输出投影 → [T,D]</text>
  </g>

  <path d="M202 214H237M387 214H422M572 214H607M757 214H792M942 214H977" class="arrow"/>

  <rect x="76" y="294" width="1048" height="62" rx="12" fill="#f8fafc" stroke="#d8e2e8"/>
  <text x="98" y="320" class="node-title" fill="#334155">连续内存（AttentionRequest）</text>
  <text x="98" y="343" class="note">查询 / 键 / 值：[词元, 头, 维度]；scale=0 时 CPU 内核使用 1/√Dh；输出保持相同词元优先布局</text>

  <text x="52" y="431" class="section">同一计算内核的两种请求形态</text>

  <rect x="52" y="454" width="526" height="174" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="76" y="486" class="node-title" fill="#28536b">预填充（Prefill）：一次处理输入序列</text>
  <text x="76" y="511" class="note">query_tokens = key_tokens = T，offset = 0</text>
  <g text-anchor="middle" font-size="12">
    <rect x="76" y="535" width="104" height="54" rx="10" fill="#e8f1f7" stroke="#7aa6bc"/>
    <text x="128" y="558" fill="#28536b" font-weight="700">Q[0..T-1]</text>
    <text x="128" y="577" fill="#52606d">全部查询</text>
    <rect x="237" y="535" width="104" height="54" rx="10" fill="#fff0dc" stroke="#e8a765"/>
    <text x="289" y="558" fill="#9a4d13" font-weight="700">三角遮罩</text>
    <text x="289" y="577" fill="#52606d">只看当前位置以前</text>
    <rect x="398" y="535" width="152" height="54" rx="10" fill="#e7f6f3" stroke="#4a9d93"/>
    <text x="474" y="558" fill="#0f5f59" font-weight="700">输出 [T,H,Dh]</text>
    <text x="474" y="577" fill="#52606d">建立每个词元结果</text>
  </g>
  <path d="M180 562H237M341 562H398" class="arrow"/>

  <rect x="606" y="454" width="542" height="174" rx="18" fill="#ffffff" stroke="#f0c89e"/>
  <text x="630" y="486" class="node-title" fill="#9a4d13">逐词元解码（Decode）：当前查询读取已有 K/V</text>
  <text x="630" y="511" class="note">query_tokens = 1，key_tokens = 已写入长度，offset 指向当前位置</text>
  <g text-anchor="middle" font-size="12">
    <rect x="630" y="535" width="104" height="54" rx="10" fill="#fee2d5" stroke="#d9773f"/>
    <text x="682" y="558" fill="#9a3412" font-weight="700">Q[当前]</text>
    <text x="682" y="577" fill="#52606d">当前词元</text>
    <rect x="791" y="535" width="130" height="54" rx="10" fill="#fff0dc" stroke="#e8a765"/>
    <text x="856" y="558" fill="#9a4d13" font-weight="700">已写入 K/V</text>
    <text x="856" y="577" fill="#52606d">位置 0..当前位置</text>
    <rect x="978" y="535" width="142" height="54" rx="10" fill="#e7f6f3" stroke="#4a9d93"/>
    <text x="1049" y="558" fill="#0f5f59" font-weight="700">输出 [1,H,Dh]</text>
    <text x="1049" y="577" fill="#52606d">聚合已写入位置</text>
  </g>
  <path d="M734 562H791M921 562H978" class="orange-arrow"/>

</svg>
