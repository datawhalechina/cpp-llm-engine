<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">多模态六任务学习路线</title>
  <desc id="desc">在 CPU 语言模型主线上，依次学习模型与图片基线、图片预处理、视觉权重、视觉编码器、统一嵌入和多模态服务。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .task { font-family: "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .chapter { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #334155; }
      .result { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #475569; }
      .number { font-family: "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .node { fill: #2563eb; stroke: #1e3a8a; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="285" rx="24" fill="#f8fafc"/>
  <text x="52" y="54" class="title">多模态六任务：从图片输入到统一服务</text>
  <path d="M138 170 H278" class="line"/><path d="M334 170 H474" class="line"/><path d="M530 170 H670" class="line"/><path d="M726 170 H866" class="line"/><path d="M922 170 H1062" class="line"/>
  <g transform="translate(110 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">模型与图片基线</text><text x="0" y="-40" text-anchor="middle" class="chapter">SmolVLM / JPEG</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">1</text><text x="0" y="56" text-anchor="middle" class="result">固定资产与外部输出</text></g>
  <g transform="translate(306 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">图片预处理</text><text x="0" y="-40" text-anchor="middle" class="chapter">Resize / Tile / Patch</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">2</text><text x="0" y="56" text-anchor="middle" class="result">确定形状与顺序</text></g>
  <g transform="translate(502 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">读取视觉模型</text><text x="0" y="-40" text-anchor="middle" class="chapter">mmproj / Q8_0</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">3</text><text x="0" y="56" text-anchor="middle" class="result">配置与权重契约</text></g>
  <g transform="translate(698 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">视觉编码器</text><text x="0" y="-40" text-anchor="middle" class="chapter">SigLIP 12 层</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">4</text><text x="0" y="56" text-anchor="middle" class="result">视觉隐藏状态</text></g>
  <g transform="translate(894 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">统一嵌入序列</text><text x="0" y="-40" text-anchor="middle" class="chapter">Projector / Decoder</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">5</text><text x="0" y="56" text-anchor="middle" class="result">文本与视觉拼接</text></g>
  <g transform="translate(1090 170)"><rect x="-82" y="-82" width="164" height="54" rx="12" class="card"/><text x="0" y="-60" text-anchor="middle" class="task">服务与性能证据</text><text x="0" y="-40" text-anchor="middle" class="chapter">Runtime / Service</text><circle r="28" class="node"/><text x="0" y="6" text-anchor="middle" class="number">6</text><text x="0" y="56" text-anchor="middle" class="result">同步 / SSE / 阶段计时</text></g>
</svg>
