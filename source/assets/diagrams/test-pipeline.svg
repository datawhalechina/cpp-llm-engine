<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">cpp-llm-engine 分层测试体系</title>
  <desc id="desc">从对象契约、不变量、组件协作、跨章主线到真实模型和性能实验逐层验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f4f1e8"/>
  <g font-family="Noto Sans CJK SC, sans-serif">
    <text x="58" y="58" fill="#172554" font-size="29" font-weight="700">测试体系：先证明约束，再证明整条链路</text>
    <text x="58" y="90" fill="#475569" font-size="15">下层失败时停止向上验证；性能数据不能替代正确性证据</text>

    <g filter="url(#shadow)">
      <rect x="70" y="130" width="700" height="82" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="98" y="164" fill="#172554" font-size="18" font-weight="700">L0 对象契约</text>
      <text x="98" y="190" fill="#334155" font-size="14">Tensor 形状、Request 转换、参数与错误路径</text>
      <text x="742" y="176" text-anchor="end" fill="#475569" font-size="13">unit / contract</text>

      <rect x="110" y="228" width="660" height="82" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="138" y="262" fill="#172554" font-size="18" font-weight="700">L1 不变量</text>
      <text x="138" y="288" fill="#334155" font-size="14">终态不可恢复、进度单调、块独占、容量守恒</text>
      <text x="742" y="274" text-anchor="end" fill="#475569" font-size="13">table / sequence</text>

      <rect x="150" y="326" width="620" height="82" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="178" y="360" fill="#172554" font-size="18" font-weight="700">L2 组件协作</text>
      <text x="178" y="386" fill="#334155" font-size="14">Scheduler、KV Cache、Runtime 的预留、提交与回滚</text>
      <text x="742" y="372" text-anchor="end" fill="#475569" font-size="13">component</text>

      <rect x="190" y="424" width="580" height="82" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="218" y="458" fill="#172554" font-size="18" font-weight="700">L3 跨章主线</text>
      <text x="218" y="484" fill="#334155" font-size="13">Loader → Decoder → Generation → KV / Scheduler → ServiceCore</text>
      <text x="742" y="470" text-anchor="end" fill="#475569" font-size="13">integration</text>

      <rect x="230" y="522" width="540" height="82" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <text x="258" y="556" fill="#172554" font-size="18" font-weight="700">L4 真实模型</text>
      <text x="258" y="582" fill="#334155" font-size="14">TinyLlama token、logits、分页 K/V、batch 与服务适配</text>
      <text x="742" y="568" text-anchor="end" fill="#475569" font-size="13">real-model</text>
    </g>

    <path d="M810 171 H850" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="862" y="128" width="275" height="184" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="888" y="163" fill="#1e3a8a" font-size="18" font-weight="700">默认回归</text>
    <text x="888" y="190" fill="#475569" font-size="14">• 代码头、文档结构与参考资产</text>
    <text x="888" y="216" fill="#475569" font-size="14">• 测试资产、契约和 owner</text>
    <text x="888" y="242" fill="#475569" font-size="14">• Foundation 与 Chapter00–10</text>
    <text x="888" y="268" fill="#475569" font-size="14">• Engine 与多模态默认路径</text>
    <text x="888" y="297" fill="#1d4ed8" font-size="13">npm run test:regression</text>

    <path d="M810 367 H850" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="862" y="330" width="275" height="132" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="888" y="365" fill="#312e81" font-size="18" font-weight="700">发布契约</text>
    <text x="888" y="396" fill="#475569" font-size="14">• 全新 Release 构建目录</text>
    <text x="888" y="423" fill="#475569" font-size="14">• CTest label 与跨章契约</text>
    <text x="888" y="449" fill="#4338ca" font-size="13">npm run test:release-contracts</text>

    <path d="M810 563 H850" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="862" y="480" width="275" height="124" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="888" y="515" fill="#7c2d12" font-size="18" font-weight="700">环境与实验证据</text>
    <text x="888" y="546" fill="#475569" font-size="14">GGUF · CUDA · HTTP transport</text>
    <text x="888" y="573" fill="#475569" font-size="14">Benchmark · Profiling</text>
    <text x="888" y="594" fill="#9a3412" font-size="12">按修改范围单独运行并记录环境</text>

    <rect x="70" y="645" width="1067" height="42" rx="12" fill="#172554"/>
    <text x="603" y="672" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">失败定位顺序：对象契约 → 不变量 → 组件事务 → 跨章接口 → 外部环境与性能</text>
  </g>
</svg>
