<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 06 单请求生成核心</title>
  <desc id="desc">Decoder 与量化权重进入 Chapter 06。请求依次经过 Prefill、采样、Decode、停止判断和词元回调，再把稳定语义交给 KV Cache、Scheduling 与 Serving。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#087f5b"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a24" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="56" y="54" font-size="27" font-weight="700" fill="#172033">Chapter 06：构建单请求生成核心</text>
  <text x="56" y="83" font-size="15" fill="#52606d">固定一个请求的 Prefill、Decode、采样、停止和输出语义</text>

  <rect x="56" y="110" width="1088" height="116" rx="18" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="80" y="140" font-size="15" font-weight="700" fill="#52606d">在教程主线中的位置</text>
  <g text-anchor="middle">
    <rect x="104" y="160" width="248" height="46" rx="12" fill="#fff1df" stroke="#efc38e"/>
    <text x="228" y="180" font-size="14" font-weight="700" fill="#92511b">Chapter 04–05</text>
    <text x="228" y="198" font-size="12" fill="#7b5b3f">Decoder 与量化权重</text>
    <rect x="476" y="151" width="248" height="64" rx="14" fill="#087f5b" filter="url(#shadow)"/>
    <text x="600" y="178" font-size="16" font-weight="700" fill="#ffffff">Chapter 06</text>
    <text x="600" y="199" font-size="13" fill="#d9fff1">单请求 Generation Core</text>
    <rect x="848" y="160" width="248" height="46" rx="12" fill="#e8f1f6" stroke="#a9c3d2"/>
    <text x="972" y="180" font-size="14" font-weight="700" fill="#315d72">Chapter 07–08–10</text>
    <text x="972" y="198" font-size="12" fill="#526b78">KV · Scheduling · Serving</text>
  </g>
  <path d="M352 183 H476" fill="none" stroke="#52606d" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M724 183 H848" fill="none" stroke="#52606d" stroke-width="2.3" marker-end="url(#arrow)"/>

  <text x="56" y="270" font-size="18" font-weight="700" fill="#172033">一个请求怎样持续产生词元</text>
  <g text-anchor="middle">
    <rect x="56" y="300" width="160" height="82" rx="14" fill="#ffffff" stroke="#9ab6c4" stroke-width="2"/>
    <text x="136" y="331" font-size="15" font-weight="700" fill="#315d72">请求</text>
    <text x="136" y="355" font-size="13" fill="#52606d">prompt · config</text>
    <text x="136" y="373" font-size="11" fill="#7b8b93">Request</text>

    <rect x="264" y="292" width="180" height="98" rx="15" fill="#def4eb" stroke="#087f5b" stroke-width="2"/>
    <text x="354" y="318" font-size="15" font-weight="700" fill="#076449">模型执行</text>
    <text x="354" y="344" font-size="12" fill="#315b4d">首次：prefill prompt</text>
    <text x="354" y="367" font-size="12" fill="#557a6c">后续：decode token</text>

    <rect x="492" y="292" width="180" height="98" rx="15" fill="#087f5b" filter="url(#shadow)"/>
    <text x="582" y="323" font-size="15" font-weight="700" fill="#ffffff">选择词元</text>
    <text x="582" y="348" font-size="13" fill="#d9fff1">logits → token</text>
    <text x="582" y="371" font-size="11" fill="#bcebd9">Sampler</text>

    <rect x="720" y="292" width="180" height="98" rx="15" fill="#fff1df" stroke="#d8893b" stroke-width="2"/>
    <text x="810" y="323" font-size="15" font-weight="700" fill="#92511b">提交与通知</text>
    <text x="810" y="348" font-size="13" fill="#715238">append · callback</text>
    <text x="810" y="371" font-size="11" fill="#8b6b50">token, step</text>

    <rect x="948" y="292" width="196" height="98" rx="15" fill="#ffffff" stroke="#9ab6c4" stroke-width="2"/>
    <text x="1046" y="323" font-size="15" font-weight="700" fill="#315d72">停止判断</text>
    <text x="1046" y="348" font-size="13" fill="#52606d">EOS · 长度 · 错误</text>
    <text x="1046" y="371" font-size="11" fill="#7b8b93">terminal state</text>
  </g>
  <path d="M216 341 H264" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M444 341 H492" fill="none" stroke="#087f5b" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path d="M672 341 H720" fill="none" stroke="#087f5b" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path d="M900 341 H948" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>

  <path d="M1046 390 V438 H354 V390" fill="none" stroke="#087f5b" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <text x="700" y="430" font-size="13" text-anchor="middle" fill="#076449">未结束：Decode 上一个生成词元，再产生下一组 logits</text>

  <rect x="56" y="476" width="520" height="90" rx="16" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="80" y="506" font-size="14" font-weight="700" fill="#52606d">A 教学闭环</text>
  <text x="80" y="532" font-size="13" fill="#52606d">确定性 logits · Greedy · 状态与回调顺序</text>
  <text x="80" y="553" font-size="12" fill="#7b8b93">固定结果使后续缓存和调度重构可比较</text>

  <rect x="624" y="476" width="520" height="90" rx="16" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="648" y="506" font-size="14" font-weight="700" fill="#52606d">B 真实执行闭环</text>
  <text x="648" y="532" font-size="13" fill="#52606d">TinyLlama Tokenizer · 22 层 Decoder · 请求 Context</text>
  <text x="648" y="553" font-size="12" fill="#7b8b93">固定 token golden 与连续请求隔离</text>

  <rect x="56" y="590" width="1088" height="32" rx="10" fill="#173f35"/>
  <text x="600" y="612" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">本章产物：不依赖 Scheduler 和物理 KV Block 的单请求生成契约</text>
</svg>
