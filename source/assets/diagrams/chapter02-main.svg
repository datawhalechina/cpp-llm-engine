<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 02 一到四维 Tensor、共享视图与显式连续化</title>
  <desc id="desc">Chapter 02 用二维地址示例解释一到四维张量共用的形状、步长和偏移，并说明非连续视图如何显式复制到连续存储。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#4f6d6a"/>
    </marker>
    <marker id="storage-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#123047" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f7f4ec"/>
  <text x="44" y="44" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="700" fill="#123047">Chapter 02：先共享数据，需要连续布局时再显式复制</text>
  <text x="44" y="72" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#526271">变形、切片和转置创建视图；连续化只为非连续视图分配新存储。</text>

  <rect x="40" y="96" width="1120" height="92" rx="16" fill="#123047"/>
  <text x="66" y="126" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#d9ece7">本章在主线中的位置</text>
  <g font-family="'Noto Sans SC', sans-serif" font-size="14" text-anchor="middle">
    <rect x="206" y="118" width="210" height="48" rx="12" fill="#f8fafc"/>
    <text x="311" y="139" font-weight="700" fill="#123047">Chapter 01</text>
    <text x="311" y="157" fill="#526271">张量对象（Tensor）</text>
    <rect x="495" y="112" width="210" height="60" rx="12" fill="#83c9b8"/>
    <text x="600" y="137" font-weight="700" fill="#073c38">Chapter 02</text>
    <text x="600" y="158" fill="#123f3b">1–4 维视图与共享存储</text>
    <rect x="784" y="118" width="210" height="48" rx="12" fill="#f8fafc"/>
    <text x="889" y="139" font-weight="700" fill="#123047">Chapter 03</text>
    <text x="889" y="157" fill="#526271">复用同一布局契约</text>
  </g>
  <path d="M416 142H495M705 142H784" stroke="#8fb8b0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="44" y="224" font-family="'Noto Sans SC', sans-serif" font-size="17" font-weight="700" fill="#123047">A 教学闭环：先用二维地址建立直觉</text>
  <text x="1156" y="224" font-family="'Noto Sans SC', sans-serif" font-size="12" text-anchor="end" fill="#64748b">B 真实执行：1D 参数 · 2D 矩阵 · 3D Q/K/V · 4D 注意力/KV</text>

  <g filter="url(#shadow)" font-family="'Noto Sans SC', sans-serif">
    <rect x="44" y="246" width="330" height="210" rx="16" fill="#fffdf8" stroke="#d8d1c3"/>
    <text x="66" y="278" font-size="17" font-weight="700" fill="#123047">原始张量</text>
    <text x="66" y="305" font-size="14" fill="#526271">2 行 × 3 列，从第 1 个元素开始</text>
    <text x="66" y="327" font-size="13" fill="#526271">每换一行跨过 3 个元素</text>
    <text x="66" y="347" font-size="11" fill="#708090">shape [2,3] · stride [3,1] · offset 0</text>
    <rect x="66" y="360" width="286" height="68" rx="10" fill="#e8f1ee"/>
    <text x="209" y="385" font-size="14" text-anchor="middle" fill="#274c4a">[ 1, 2, 3 ]</text>
    <text x="209" y="410" font-size="14" text-anchor="middle" fill="#274c4a">[ 4, 5, 6 ]</text>

    <rect x="435" y="246" width="330" height="210" rx="16" fill="#e8f1ee" stroke="#9fc9bf"/>
    <text x="457" y="278" font-size="17" font-weight="700" fill="#0f5f59">变形后的视图（reshape）</text>
    <text x="457" y="305" font-size="14" fill="#274c4a">3 行 × 2 列，从第 1 个元素开始</text>
    <text x="457" y="327" font-size="13" fill="#274c4a">每换一行跨过 2 个元素</text>
    <text x="457" y="347" font-size="11" fill="#52736d">shape [3,2] · stride [2,1] · offset 0</text>
    <rect x="457" y="360" width="286" height="68" rx="10" fill="#d2e9e3"/>
    <text x="600" y="379" font-size="13" text-anchor="middle" fill="#274c4a">[ 1, 2 ]</text>
    <text x="600" y="398" font-size="13" text-anchor="middle" fill="#274c4a">[ 3, 4 ]</text>
    <text x="600" y="417" font-size="13" text-anchor="middle" fill="#274c4a">[ 5, 6 ]</text>

    <rect x="826" y="246" width="330" height="210" rx="16" fill="#fff0cf" stroke="#d79a27"/>
    <text x="848" y="278" font-size="17" font-weight="700" fill="#9a4e08">截取后的视图（slice）</text>
    <text x="848" y="305" font-size="14" fill="#75400d">2 行 × 2 列，从第 2 个元素开始</text>
    <text x="848" y="327" font-size="13" fill="#75400d">每换一行仍跨过 3 个元素</text>
    <text x="848" y="347" font-size="11" fill="#98662e">shape [2,2] · stride [3,1] · offset 1</text>
    <rect x="848" y="360" width="286" height="68" rx="10" fill="#ffe4aa"/>
    <text x="991" y="385" font-size="14" text-anchor="middle" fill="#75400d">[ 2, 3 ]</text>
    <text x="991" y="410" font-size="14" text-anchor="middle" fill="#75400d">[ 5, 6 ]</text>
  </g>

  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <path d="M209 456V508" marker-end="url(#storage-arrow)"/>
    <path d="M600 456V508" marker-end="url(#storage-arrow)"/>
    <path d="M991 456V508" marker-end="url(#storage-arrow)"/>
  </g>

  <rect x="178" y="512" width="844" height="76" rx="16" fill="#0f766e"/>
  <text x="210" y="542" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#fff">共享的底层存储</text>
  <g font-family="'Noto Sans SC', sans-serif" font-size="15" text-anchor="middle">
    <rect x="350" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="377" y="553" fill="#0f5f59">1</text>
    <rect x="414" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="441" y="553" fill="#0f5f59">2</text>
    <rect x="478" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="505" y="553" fill="#0f5f59">3</text>
    <rect x="542" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="569" y="553" fill="#0f5f59">4</text>
    <rect x="606" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="633" y="553" fill="#0f5f59">5</text>
    <rect x="670" y="529" width="54" height="38" rx="8" fill="#f0fdfa"/><text x="697" y="553" fill="#0f5f59">6</text>
  </g>
  <text x="990" y="555" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="end" fill="#ccfbf1">三个对象都引用这里，不复制数值</text>

  <rect x="178" y="610" width="402" height="42" rx="21" fill="#fffdf8" stroke="#d8d1c3"/>
  <text x="379" y="636" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="middle" fill="#526271">B 跨章输入：存储基址 + 布局（TensorViewRef）</text>
  <rect x="600" y="610" width="422" height="42" rx="21" fill="#fff0cf" stroke="#d79a27"/>
  <text x="811" y="636" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="middle" fill="#75400d">A→B：非连续时用连续化接口显式复制</text>
</svg>
