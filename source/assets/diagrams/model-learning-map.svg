<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc">
  <title id="title">教程模型与架构学习关系</title>
  <desc id="desc">TinyLlama 建立稠密基线，Qwen3 检验第二种稠密架构，Qwen1.5 MoE 引入专家路由，DeepSeek V2 Lite 组合 MLA 与 MoE，SmolVLM 扩展视觉输入；五种模型复用同一推理主线。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f3e7"/><stop offset="1" stop-color="#e5f0ec"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315650"/></marker><style>.title{font:700 28px 'Noto Sans CJK SC',sans-serif;fill:#173832}.sub{font:500 15px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.head{font:700 16px 'Noto Sans CJK SC',sans-serif;fill:#173832}.small{font:500 12px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.tag{font:700 12px 'Noto Sans CJK SC',sans-serif;fill:#8b5b20}.box{stroke:#315650;stroke-width:1.8;rx:14}.line{stroke:#58756f;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.soft{stroke:#829892;stroke-width:1.6;fill:none}</style></defs>
  <rect width="1240" height="650" fill="url(#bg)"/>
  <text x="50" y="50" class="title">五种模型，用来回答四类架构问题</text>
  <text x="50" y="78" class="sub">每个模型承担明确的结构验证任务；每次扩展都用于发现并移除一种单模型假设。</text>

  <rect x="470" y="120" width="300" height="105" class="box" fill="#fff1cf"/>
  <text x="620" y="150" text-anchor="middle" class="tag">默认基线</text><text x="620" y="179" text-anchor="middle" class="head">TinyLlama 1.1B</text><text x="620" y="202" text-anchor="middle" class="small">Llama 稠密 Decoder · GQA · SwiGLU</text>

  <path d="M620 225V260H155V290M620 260H465V290M620 260H775V290M620 260H1085V290" class="soft"/>
  <path d="M155 260V290M465 260V290M775 260V290M1085 260V290" class="line"/>

  <rect x="40" y="290" width="230" height="155" class="box" fill="#f4ead9"/>
  <text x="155" y="320" text-anchor="middle" class="tag">第二种稠密结构</text><text x="155" y="349" text-anchor="middle" class="head">Qwen3-0.6B</text><text x="155" y="376" text-anchor="middle" class="small">Q/K Norm · NeoX RoPE</text><text x="155" y="398" text-anchor="middle" class="small">非对称 Q/K/V 头</text><text x="155" y="420" text-anchor="middle" class="small">检验配置驱动的 Decoder</text>

  <rect x="350" y="290" width="230" height="155" class="box" fill="#e7f2e9"/>
  <text x="465" y="320" text-anchor="middle" class="tag">稀疏 FFN</text><text x="465" y="349" text-anchor="middle" class="head">Qwen1.5-MoE</text><text x="465" y="376" text-anchor="middle" class="small">Router · Top-K</text><text x="465" y="398" text-anchor="middle" class="small">打包专家 · 共享专家</text><text x="465" y="420" text-anchor="middle" class="small">检验专家分组与合并</text>

  <rect x="660" y="290" width="230" height="155" class="box" fill="#dcece7"/>
  <text x="775" y="320" text-anchor="middle" class="tag">压缩 Attention + MoE</text><text x="775" y="349" text-anchor="middle" class="head">DeepSeek-V2-Lite</text><text x="775" y="376" text-anchor="middle" class="small">MLA 压缩 K/V</text><text x="775" y="398" text-anchor="middle" class="small">Dense / MoE 混合层</text><text x="775" y="420" text-anchor="middle" class="small">检验缓存与模型拓扑变化</text>

  <rect x="970" y="290" width="230" height="155" class="box" fill="#e4eef9"/>
  <text x="1085" y="320" text-anchor="middle" class="tag">视觉输入扩展</text><text x="1085" y="349" text-anchor="middle" class="head">SmolVLM-500M</text><text x="1085" y="376" text-anchor="middle" class="small">动态切图 · SigLIP</text><text x="1085" y="398" text-anchor="middle" class="small">Projector · 统一嵌入</text><text x="1085" y="420" text-anchor="middle" class="small">检验共享语言运行时</text>

  <path d="M155 445V490M465 445V490M775 445V490M1085 445V490" class="soft"/>
  <rect x="80" y="490" width="1080" height="105" class="box" fill="#f7fbf9"/>
  <text x="620" y="520" text-anchor="middle" class="head">共同推理主线</text>
  <text x="620" y="549" text-anchor="middle" class="small">GGUF / Tokenizer　→　Model + Context　→　Generation Runtime　→　K/V 与 Scheduler　→　Service</text>
  <text x="620" y="575" text-anchor="middle" class="small">模型差异改变配置、局部结构和权重格式，不复制请求生命周期</text>
  <text x="50" y="630" class="sub">建议顺序：先完成 TinyLlama，再按学习目标选择 Qwen3、MoE、MLA 或多模态分支。</text>
</svg>
