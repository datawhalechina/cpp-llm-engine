<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 00 在教程中的位置与学习步骤</title>
  <desc id="desc">Foundation 之后先完成 A 准备检查，再通过 B 真实基线运行 TinyLlama，随后进入 Chapter01 到 Chapter10。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 22px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .section { font: 700 17px "Noto Sans CJK SC", sans-serif; }
      .label { font: 600 14px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .small { font: 400 12px "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#f8fafc"/>
  <text x="36" y="38" class="title">Chapter 00 · 建立真实推理基线</text>
  <rect x="36" y="65" width="500" height="225" rx="14" fill="#e8f1ff"/>
  <text x="60" y="98" class="section" fill="#24548f">整体位置</text>
  <rect x="65" y="143" width="115" height="52" rx="9" fill="#ffffff"/>
  <text x="122" y="174" text-anchor="middle" class="label">Foundation</text>
  <rect x="218" y="132" width="138" height="74" rx="10" fill="#2563eb"/>
  <text x="287" y="163" text-anchor="middle" class="label" fill="#ffffff">Chapter 00</text>
  <text x="287" y="185" text-anchor="middle" class="small" fill="#dbeafe">真实外部基线</text>
  <rect x="394" y="143" width="115" height="52" rx="9" fill="#ffffff"/>
  <text x="451" y="165" text-anchor="middle" class="label">Chapter01–10</text>
  <text x="451" y="184" text-anchor="middle" class="small">自研 CPU 主线</text>
  <path d="M180 169H218M356 169H394" class="line"/>
  <rect x="566" y="65" width="598" height="225" rx="14" fill="#fff7ed"/>
  <text x="590" y="98" class="section" fill="#9a4d13">A 准备检查 → B 真实基线</text>
  <g text-anchor="middle">
    <rect x="586" y="137" width="96" height="64" rx="9" fill="#ffedd5"/><text x="634" y="164" class="label">A 环境检查</text><text x="634" y="184" class="small">C++ / CMake</text>
    <rect x="700" y="137" width="96" height="64" rx="9" fill="#ffedd5"/><text x="748" y="164" class="label">编译基线</text><text x="748" y="184" class="small">llama.cpp</text>
    <rect x="814" y="137" width="96" height="64" rx="9" fill="#ffedd5"/><text x="862" y="164" class="label">模型校验</text><text x="862" y="184" class="small">GGUF / SHA256</text>
    <rect x="928" y="132" width="96" height="74" rx="10" fill="#fb923c"/><text x="976" y="163" class="label" fill="#ffffff">B 真实推理</text><text x="976" y="184" class="small" fill="#fff7ed">CPU / greedy</text>
    <rect x="1042" y="137" width="96" height="64" rx="9" fill="#ffedd5"/><text x="1090" y="164" class="label">失败定位</text><text x="1090" y="184" class="small">工具到参数</text>
  </g>
  <path d="M682 169H700M796 169H814M910 169H928M1024 169H1042" class="line"/>
</svg>
