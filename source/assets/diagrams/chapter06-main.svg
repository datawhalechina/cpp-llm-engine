<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 06 让请求持续经过模型并逐 token 生成</title>
  <desc id="desc">Chapter 06 位于 Decoder 和服务核心之间。A 教学状态机固定生成契约，B 真实执行线接入 TinyLlama Context、批处理和分页 K/V 数据面。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c45b16"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="54" y="55" font-size="27" font-weight="700" fill="#172033">Chapter 06：让请求持续经过模型并逐 token 生成</text>
  <text x="54" y="84" font-size="15" fill="#52606d">第一次处理整段 prompt，之后复用历史状态，每一步选择一个新 token</text>

  <!-- Position in the engine -->
  <rect x="54" y="112" width="1092" height="124" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="143" font-size="15" font-weight="700" fill="#52606d">在推理引擎中的位置</text>
  <g text-anchor="middle">
    <rect x="102" y="163" width="254" height="50" rx="12" fill="#fff0dc"/>
    <text x="229" y="185" font-size="15" font-weight="700" fill="#9a4d13">Chapter 04–05</text>
    <text x="229" y="203" font-size="13" fill="#8a5b32">Decoder 与量化 Linear</text>

    <rect x="473" y="155" width="254" height="66" rx="13" fill="#0f766e" filter="url(#shadow)"/>
    <text x="600" y="183" font-size="16" font-weight="700" fill="#ffffff">Chapter 06</text>
    <text x="600" y="204" font-size="14" fill="#d9fffa">请求状态与生成循环</text>

    <rect x="844" y="163" width="254" height="50" rx="12" fill="#e8f1f7"/>
    <text x="971" y="185" font-size="15" font-weight="700" fill="#28536b">Chapter 09</text>
    <text x="971" y="203" font-size="13" fill="#476878">Service Core 接收并管理请求</text>
  </g>
  <path d="M356 188 H473" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M727 188 H844" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Runtime loop -->
  <text x="54" y="278" font-size="18" font-weight="700" fill="#172033">本章核心：A 教学状态机与 B 真实 Executor 共用一次 prefill、多次 decode</text>
  <g text-anchor="middle">
    <rect x="54" y="309" width="150" height="86" rx="15" fill="#ffffff" stroke="#93b6c8" stroke-width="2"/>
    <text x="129" y="340" font-size="15" font-weight="700" fill="#28536b">请求</text>
    <text x="129" y="365" font-size="12" fill="#52606d">prompt · token budget</text>
    <text x="129" y="383" font-size="12" fill="#52606d">Request</text>

    <rect x="252" y="301" width="180" height="102" rx="16" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
    <text x="342" y="332" font-size="15" font-weight="700" fill="#0f5f59">运行时步骤</text>
    <text x="342" y="358" font-size="13" fill="#244b49">首次：prefill prompt</text>
    <text x="342" y="382" font-size="13" fill="#244b49">后续：decode 1 token</text>

    <rect x="480" y="301" width="190" height="102" rx="16" fill="#0f766e" filter="url(#shadow)"/>
    <text x="575" y="332" font-size="15" font-weight="700" fill="#ffffff">模型执行器</text>
    <text x="575" y="358" font-size="13" fill="#d9fffa">Decoder / LM Head</text>
    <text x="575" y="382" font-size="12" fill="#c5eee8">输出 logits</text>

    <rect x="718" y="309" width="150" height="86" rx="15" fill="#fff0dc" stroke="#e8a765" stroke-width="2"/>
    <text x="793" y="340" font-size="15" font-weight="700" fill="#9a4d13">选择 token</text>
    <text x="793" y="365" font-size="13" fill="#6f5438">Sampler</text>
    <text x="793" y="383" font-size="12" fill="#6f5438">greedy / temperature</text>

    <rect x="916" y="301" width="230" height="102" rx="16" fill="#ffffff" stroke="#79a4ba" stroke-width="2"/>
    <text x="1031" y="332" font-size="15" font-weight="700" fill="#28536b">更新请求状态</text>
    <text x="1031" y="358" font-size="13" fill="#52606d">追加 token · 检查停止条件</text>
    <text x="1031" y="382" font-size="12" fill="#708090">EOS / budget / cancel / error</text>
  </g>
  <path d="M204 352 H252" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M432 352 H480" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M670 352 H718" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M868 352 H916" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Continue and terminal branches -->
  <circle cx="1031" cy="403" r="4" fill="#52606d"/>
  <path d="M1031 403 H900 V448 H342 V403" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="686" y="441" font-size="12" text-anchor="middle" fill="#0f5f59">未结束：保留 Request 与模型 Context，进入下一次 decode</text>

  <rect x="916" y="470" width="230" height="72" rx="15" fill="#e8f1f7" stroke="#28536b" stroke-width="2"/>
  <text x="1031" y="499" font-size="15" font-weight="700" text-anchor="middle" fill="#28536b">终态输出与资源释放</text>
  <text x="1031" y="523" font-size="12" text-anchor="middle" fill="#52606d">完成 · 取消 · 超时 · 失败</text>
  <path d="M1031 403 V470" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1041" y="443" font-size="12" fill="#28536b">已结束</text>

  <rect x="54" y="482" width="720" height="60" rx="15" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="76" y="507" font-size="14" font-weight="700" fill="#52606d">A/B 共享的请求级历史状态</text>
  <text x="76" y="530" font-size="13" fill="#708090">token history 属于 Request；分层 K/V 属于该请求的 Model Context；两者不能混用</text>

  <rect x="54" y="576" width="1092" height="42" rx="12" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="600" y="602" font-size="14" font-weight="700" text-anchor="middle" fill="#52606d">验证：A 固定状态 · B TinyLlama golden · 请求隔离 · 终态释放 · streaming 顺序一致</text>

  <rect x="54" y="630" width="1092" height="30" rx="10" fill="#173f3c"/>
  <text x="600" y="651" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">学习结果：能沿一次请求追踪模型执行、token 选择、状态更新和循环终止</text>
</svg>
