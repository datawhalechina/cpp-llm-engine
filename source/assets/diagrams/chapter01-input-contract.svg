<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">文本输入与模型文件在解码器执行前汇合</title>
  <desc id="desc">上方文本链经过教学或真实 Tokenizer、TokenSequence 和输入检查；下方 GGUF 链经过 metadata、tensor index、ModelConfig 和权重加载；两条链共同进入 Decoder 与 Runtime。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .heading { font-size: 27px; font-weight: 700; fill: #172033; }
      .section { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-sub { font-size: 12px; fill: #52606d; }
      .note { font-size: 13px; fill: #52606d; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 2.3; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .orange-arrow { fill: none; stroke: #c45b16; stroke-width: 2.5; marker-end: url(#arrow-orange); }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f2fbf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c45b16"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="52" y="55" class="heading">两条输入链：文本给出词元，模型文件给出计算材料</text>
  <text x="52" y="84" class="note">词表大小把两条链约束在一起，解码器执行同时消费词元编号、配置和权重</text>

  <rect x="52" y="112" width="1096" height="202" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="76" y="145" class="section" fill="#1d4ed8">文本输入链</text>
  <g text-anchor="middle">
    <rect x="76" y="177" width="142" height="76" rx="13" fill="#eff6ff" stroke="#7aa6d8"/>
    <text x="147" y="208" class="node-title" fill="#1d4ed8">用户文本</text>
    <text x="147" y="232" class="node-sub">Hello TinyLlama</text>

    <rect x="266" y="165" width="180" height="100" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="356" y="197" class="node-title" fill="#1d4ed8">分词器（Tokenizer）</text>
    <text x="356" y="222" class="node-sub">A：固定字母映射</text>
    <text x="356" y="244" class="node-sub">B：GGUF + llama.cpp</text>

    <rect x="494" y="177" width="174" height="76" rx="13" fill="#eff6ff" stroke="#7aa6d8"/>
    <text x="581" y="208" class="node-title" fill="#1d4ed8">词元序列</text>
    <text x="581" y="232" class="node-sub">词元编号 · 输入长度</text>

    <rect x="716" y="165" width="190" height="100" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="811" y="197" class="node-title" fill="#334155">输入一致性检查</text>
    <text x="811" y="222" class="node-sub">ID &lt; vocab_size</text>
    <text x="811" y="244" class="node-sub">长度与停止条件</text>

    <rect x="954" y="177" width="166" height="76" rx="13" fill="#e7f6f3" stroke="#4a9d93"/>
    <text x="1037" y="208" class="node-title" fill="#0f5f59">请求输入</text>
    <text x="1037" y="232" class="node-sub">Chapter06</text>
  </g>
  <path d="M218 215H266M446 215H494M668 215H716M906 215H954" class="blue-arrow"/>

  <rect x="52" y="342" width="1096" height="202" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="76" y="375" class="section" fill="#c45b16">模型文件链</text>
  <g text-anchor="middle">
    <rect x="76" y="407" width="142" height="76" rx="13" fill="#fff7ed" stroke="#e8a765"/>
    <text x="147" y="438" class="node-title" fill="#9a4d13">GGUF 文件</text>
    <text x="147" y="462" class="node-sub">元数据 + 权重数据</text>

    <rect x="266" y="395" width="180" height="100" rx="14" fill="#fff0dc" stroke="#e8a765"/>
    <text x="356" y="427" class="node-title" fill="#9a4d13">解析模型材料</text>
    <text x="356" y="452" class="node-sub">元数据 · 张量索引</text>
    <text x="356" y="474" class="node-sub">分词器元数据</text>

    <rect x="494" y="395" width="174" height="100" rx="14" fill="#fff7ed" stroke="#e8a765"/>
    <text x="581" y="427" class="node-title" fill="#9a4d13">模型配置</text>
    <text x="581" y="452" class="node-sub">vocab · hidden · layers</text>
    <text x="581" y="474" class="node-sub">context length</text>

    <rect x="716" y="395" width="190" height="100" rx="14" fill="#fff7ed" stroke="#e8a765"/>
    <text x="811" y="427" class="node-title" fill="#9a4d13">权重张量</text>
    <text x="811" y="452" class="node-sub">词元嵌入 · 解码器</text>
    <text x="811" y="474" class="node-sub">LM Head</text>

    <rect x="954" y="407" width="166" height="76" rx="13" fill="#e7f6f3" stroke="#4a9d93"/>
    <text x="1037" y="438" class="node-title" fill="#0f5f59">已加载模型</text>
    <text x="1037" y="462" class="node-sub">Chapter04</text>
  </g>
  <path d="M218 445H266M446 445H494M668 445H716M906 445H954" class="orange-arrow"/>

  <circle cx="1082" cy="520" r="8" fill="#0f766e"/>
  <path d="M1037 253V286H1104V520H1090" class="blue-arrow"/>
  <path d="M1037 483V520H1074" class="orange-arrow"/>
  <rect x="730" y="565" width="274" height="74" rx="15" fill="#0f766e" filter="url(#shadow)"/>
  <text x="867" y="595" text-anchor="middle" class="node-title" fill="#ffffff">解码器 / 生成运行时</text>
  <text x="867" y="620" text-anchor="middle" font-size="13" fill="#d9fffa">模型权重 + 词元编号 → 候选分数</text>
  <path d="M1082 528V602H1004" class="arrow"/>

  <rect x="52" y="565" width="620" height="74" rx="15" fill="#f8fafc" stroke="#d8e2e8"/>
  <text x="76" y="594" class="node-title" fill="#334155">共同约束</text>
  <text x="76" y="619" class="note">Tokenizer vocab_size = ModelConfig vocab_size = embedding / LM Head 词表维度</text>
</svg>
