<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 04 从解码器块走到真实 TinyLlama</title>
  <desc id="desc">Chapter 04 接收三维或四维 Q/K/V 张量，调用注意力后端，再把归一化、注意力、残差和前馈网络组装为解码器块；TinyLlama 重复 22 个解码器块后得到最终候选分数。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c45b16"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="54" y="55" font-size="27" font-weight="700" fill="#172033">Chapter 04：从解码器块走到真实 TinyLlama</text>
  <text x="54" y="84" font-size="15" fill="#52606d">前三章提供模型材料、张量视图和矩阵乘法语义；本章组装解码器，Chapter 05 再接入真实量化线性层</text>

  <!-- Position in the learning path -->
  <rect x="54" y="112" width="1092" height="124" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="143" font-size="15" font-weight="700" fill="#52606d">在推理引擎中的位置</text>
  <g text-anchor="middle">
    <rect x="76" y="163" width="218" height="50" rx="12" fill="#e8f1f7"/>
    <text x="185" y="185" font-size="15" font-weight="700" fill="#28536b">Chapter 01–03</text>
    <text x="185" y="203" font-size="12" fill="#476878">模型材料 · 视图 · 矩阵乘法</text>

    <rect x="350" y="155" width="218" height="66" rx="13" fill="#c45b16" filter="url(#shadow)"/>
    <text x="459" y="183" font-size="16" font-weight="700" fill="#ffffff">Chapter 04</text>
    <text x="459" y="204" font-size="13" fill="#fff2e8">解码器结构与注意力</text>

    <rect x="624" y="163" width="218" height="50" rx="12" fill="#fff0dc"/>
    <text x="733" y="185" font-size="15" font-weight="700" fill="#9a4d13">Chapter 05</text>
    <text x="733" y="203" font-size="12" fill="#6f5438">量化权重与线性计算后端</text>

    <rect x="898" y="163" width="218" height="50" rx="12" fill="#e7f6f3"/>
    <text x="1007" y="185" font-size="15" font-weight="700" fill="#0f5f59">Chapter 06</text>
    <text x="1007" y="203" font-size="12" fill="#376963">请求状态与逐词元生成</text>
  </g>
  <path d="M294 188H350M568 188H624M842 188H898" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decoder main path -->
  <text x="54" y="278" font-size="18" font-weight="700" fill="#172033">A 教学闭环：先验证一层解码器数据流</text>
  <text x="1146" y="278" font-size="12" text-anchor="end" fill="#64748b">B 跨章执行：3D/4D Q/K/V → Chapter 05 Linear → TinyLlama 22 层</text>
  <g text-anchor="middle">
    <rect x="54" y="307" width="100" height="68" rx="13" fill="#ffffff" stroke="#93b6c8" stroke-width="2"/>
    <text x="104" y="334" font-size="15" font-weight="700" fill="#28536b">输入 x</text>
    <text x="104" y="357" font-size="12" fill="#52606d">[tokens,D]</text>

    <rect x="184" y="307" width="112" height="68" rx="13" fill="#fff0dc" stroke="#e8a765"/>
    <text x="240" y="334" font-size="14" font-weight="700" fill="#9a4d13">先归一化</text>
    <text x="240" y="357" font-size="12" fill="#6f5438">LayerNorm / RMSNorm</text>

    <rect x="326" y="299" width="154" height="84" rx="14" fill="#c45b16" filter="url(#shadow)"/>
    <text x="403" y="332" font-size="15" font-weight="700" fill="#ffffff">注意力</text>
    <text x="403" y="353" font-size="12" fill="#fff2e8">MHA / GQA + RoPE</text>
    <text x="403" y="372" font-size="10" fill="#ffe0ca">[T,H,Dh] / [B,T,H,Dh]</text>

    <circle cx="548" cy="341" r="27" fill="#ffffff" stroke="#c45b16" stroke-width="2"/>
    <text x="548" y="349" font-size="25" font-weight="700" fill="#c45b16">+</text>

    <rect x="605" y="307" width="112" height="68" rx="13" fill="#fff0dc" stroke="#e8a765"/>
    <text x="661" y="334" font-size="14" font-weight="700" fill="#9a4d13">再归一化</text>
    <text x="661" y="357" font-size="12" fill="#6f5438">LayerNorm / RMSNorm</text>

    <rect x="747" y="299" width="154" height="84" rx="14" fill="#0f766e" filter="url(#shadow)"/>
    <text x="824" y="332" font-size="15" font-weight="700" fill="#ffffff">前馈网络</text>
    <text x="824" y="357" font-size="12" fill="#d9fffa">ReLU / SwiGLU</text>

    <circle cx="969" cy="341" r="27" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="969" y="349" font-size="25" font-weight="700" fill="#0f766e">+</text>

    <rect x="1026" y="307" width="120" height="68" rx="13" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
    <text x="1086" y="334" font-size="15" font-weight="700" fill="#0f5f59">输出 y</text>
    <text x="1086" y="357" font-size="12" fill="#52606d">[tokens,D]</text>
  </g>

  <g fill="none" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M154 341 H184"/>
    <path d="M296 341 H326"/>
    <path d="M480 341 H521"/>
    <path d="M575 341 H605"/>
    <path d="M717 341 H747"/>
    <path d="M901 341 H942"/>
    <path d="M996 341 H1026"/>
  </g>

  <!-- Residual paths -->
  <path d="M154 341 V425 H548 V368" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M575 341 V452 H969 V368" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="154" cy="341" r="4" fill="#c45b16"/>
  <circle cx="575" cy="341" r="4" fill="#0f766e"/>
  <text x="326" y="418" font-size="12" fill="#9a4d13">第一次残差：x + Attention(Norm(x))</text>
  <text x="746" y="446" font-size="12" fill="#0f5f59">第二次残差：h + FFN(Norm(h))</text>

  <!-- What each module contributes -->
  <g>
    <rect x="54" y="488" width="334" height="94" rx="16" fill="#ffffff" stroke="#d8e2e8"/>
    <text x="76" y="518" font-size="14" font-weight="700" fill="#28536b">A 教学注意力数据流</text>
    <text x="76" y="544" font-size="13" fill="#52606d">相关性分数 → 因果遮罩 → 稳定 Softmax</text>
    <text x="76" y="566" font-size="12" fill="#708090">[tokens,D] → MHA → [tokens,D]</text>

    <rect x="413" y="488" width="334" height="94" rx="16" fill="#ffffff" stroke="#d8e2e8"/>
    <text x="435" y="518" font-size="14" font-weight="700" fill="#9a4d13">前馈网络变换每个词元</text>
    <text x="435" y="544" font-size="13" fill="#52606d">D 维 → 扩展维度 → 激活 → D 维</text>
    <text x="435" y="566" font-size="12" fill="#708090">不同词元之间不在这里交换信息</text>

    <rect x="772" y="488" width="374" height="94" rx="16" fill="#ffffff" stroke="#d8e2e8"/>
    <text x="794" y="518" font-size="14" font-weight="700" fill="#0f5f59">B 进入真实 TinyLlama</text>
    <text x="794" y="544" font-size="13" fill="#52606d">解码器块 × 22 → 最终 RMSNorm</text>
    <text x="794" y="566" font-size="12" fill="#708090">LM Head → 最终候选分数</text>
  </g>

  <rect x="54" y="613" width="1092" height="42" rx="12" fill="#173f3c"/>
  <text x="600" y="640" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">学习结果：能追踪一层计算，并说明接入 Chapter 05 后怎样执行 22 层并得到候选分数</text>
</svg>
