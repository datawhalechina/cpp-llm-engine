<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">推理引擎共享控制面与 CPU CUDA 执行后端</title>
  <desc id="desc">服务、调度、生成运行时和模型上下文组成共享控制面；模型通过稳定算子边界调用 CPU 或 CUDA 后端，两条路径使用共同的正确性和性能证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f3e7"/><stop offset="1" stop-color="#e5f0ec"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315650"/></marker>
    <style>.title{font:700 28px 'Noto Sans CJK SC',sans-serif;fill:#173832}.sub{font:500 15px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.section{font:700 14px 'Noto Sans CJK SC',sans-serif;fill:#8b5b20}.head{font:700 16px 'Noto Sans CJK SC',sans-serif;fill:#173832}.small{font:500 12px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.code{font:500 12px 'JetBrains Mono',monospace;fill:#49615c}.inverse{fill:#fff}.inverseSub{fill:#d7e5e1}.box{stroke:#315650;stroke-width:1.8;rx:14}.line{stroke:#4f7069;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{stroke:#78908a;stroke-width:1.7;fill:none}</style>
  </defs>
  <rect width="1240" height="680" fill="url(#bg)"/>
  <text x="50" y="50" class="title">CPU 与 CUDA：共享控制面，只在执行后端分叉</text>
  <text x="50" y="78" class="sub">请求状态、调度和服务生命周期保持一致；设备差异集中在数据存储、计算核和工作区。</text>

  <text x="50" y="120" class="section">共享请求与模型主线</text>
  <rect x="50" y="145" width="210" height="90" class="box" fill="#fff1cf"/><text x="155" y="176" text-anchor="middle" class="head">ServiceCore</text><text x="155" y="201" text-anchor="middle" class="small">准入 · HTTP/SSE</text><text x="155" y="221" text-anchor="middle" class="small">取消、超时与释放</text>
  <rect x="300" y="145" width="210" height="90" class="box" fill="#e7f2e9"/><text x="405" y="176" text-anchor="middle" class="head">Scheduler</text><text x="405" y="201" text-anchor="middle" class="small">请求选择 · Token 预算</text><text x="405" y="221" text-anchor="middle" class="small">连续批处理</text>
  <rect x="550" y="145" width="220" height="90" class="box" fill="#e4eef9"/><text x="660" y="176" text-anchor="middle" class="head">Runtime + Executor</text><text x="660" y="201" text-anchor="middle" class="small">Prefill · Decode · Sample</text><text x="660" y="221" text-anchor="middle" class="small">推进请求状态</text>
  <rect x="810" y="145" width="250" height="90" class="box" fill="#f7fbf9"/><text x="935" y="176" text-anchor="middle" class="head">Model + Context</text><text x="935" y="201" text-anchor="middle" class="small">Decoder · position · K/V</text><text x="935" y="221" text-anchor="middle" class="small">共享权重，请求独占状态</text>
  <rect x="1090" y="145" width="110" height="90" class="box" fill="#fff1cf"/><text x="1145" y="176" text-anchor="middle" class="head">模型资产</text><text x="1145" y="201" text-anchor="middle" class="small">GGUF</text><text x="1145" y="221" text-anchor="middle" class="small">Tokenizer</text>
  <path d="M260 190H300" class="line"/><path d="M510 190H550" class="line"/><path d="M770 190H810" class="line"/><path d="M1090 190H1060" class="line"/>

  <rect x="250" y="290" width="740" height="82" class="box" fill="#f4ead9"/>
  <text x="620" y="320" text-anchor="middle" class="head">稳定算子与数据边界</text>
  <text x="620" y="345" text-anchor="middle" class="code">Tensor shape / dtype / ownership · Linear · Attention · Norm · K/V transaction</text>
  <text x="620" y="363" text-anchor="middle" class="small">边界规定输入、输出和失败行为；具体后端决定数据放在哪里、怎样并行计算</text>
  <path d="M935 235V270H620V290" class="line"/>

  <text x="50" y="420" class="section">设备执行分叉</text>
  <rect x="80" y="445" width="500" height="125" class="box" fill="#fff1cf"/>
  <text x="330" y="478" text-anchor="middle" class="head">CPU Backend</text><text x="330" y="503" text-anchor="middle" class="small">Host Tensor · 连续/分页 K/V · 线程工作区</text><text x="330" y="526" text-anchor="middle" class="small">标量参考 → 融合路径 → SIMD → 多线程</text><text x="330" y="549" text-anchor="middle" class="small">优先固定算法语义、错误边界和可调试结果</text>
  <rect x="660" y="445" width="500" height="125" class="box" fill="#e4eef9"/>
  <text x="910" y="478" text-anchor="middle" class="head">CUDA Backend</text><text x="910" y="503" text-anchor="middle" class="small">Device Tensor · Stream/Event · 持久工作区</text><text x="910" y="526" text-anchor="middle" class="small">cuBLAS · 量化 GEMV · 分页 GQA/MLA · MoE</text><text x="910" y="549" text-anchor="middle" class="small">优化带宽、并行归约、计算核融合和批执行</text>
  <path d="M620 372V410H330V445" class="line"/><path d="M620 410H910V445" class="line"/>

  <path d="M330 570V598H620M910 570V598H620" class="soft"/><path d="M620 598V615" class="line"/>
  <rect x="170" y="615" width="900" height="45" rx="15" fill="#173832"/>
  <text x="620" y="643" text-anchor="middle" class="head inverse">共同证据：CPU Golden → 跨后端数值对照 → 真实模型 → A/B → 性能剖析</text>
</svg>
