<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 07 分页 K/V 缓存事务</title>
  <desc id="desc">执行前记录已提交词元数并预留槽位，所有解码层写入成功后才提交；失败时裁剪到旧计数，请求终态时释放全部物理块。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-good" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }</style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" font-size="27" font-weight="700" fill="#172033">Chapter 07 · 预留、逐层写入、提交与回滚</text>
  <text x="54" y="84" font-size="15" fill="#52606d">未提交位置不可读；任一层失败都恢复到执行前计数</text>

  <g text-anchor="middle">
    <rect x="54" y="132" width="200" height="104" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="154" y="164" font-size="15" font-weight="700" fill="#172033">1 记录旧计数</text>
    <text x="154" y="190" font-size="13" fill="#52606d">previous_count</text>
    <text x="154" y="213" font-size="12" fill="#64748b">已提交位置仍可读</text>

    <rect x="294" y="132" width="200" height="104" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="394" y="164" font-size="15" font-weight="700" fill="#172033">2 预留目标容量</text>
    <text x="394" y="190" font-size="13" fill="#52606d">reserve(target_count)</text>
    <text x="394" y="213" font-size="12" fill="#64748b">只分配槽位，不增加已提交数</text>

    <rect x="534" y="124" width="200" height="120" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="634" y="160" font-size="15" font-weight="700" fill="#172033">3 逐层写入 K/V</text>
    <text x="634" y="188" font-size="13" fill="#52606d">write_token(layer, position)</text>
    <text x="634" y="212" font-size="12" fill="#64748b">每层独立记录 written</text>
    <text x="634" y="230" font-size="11" fill="#64748b">任一层失败即停止</text>

    <rect x="774" y="132" width="200" height="104" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="874" y="164" font-size="15" font-weight="700" fill="#172033">4 检查所有层</text>
    <text x="874" y="190" font-size="13" fill="#52606d">all layers written?</text>
    <text x="874" y="213" font-size="12" fill="#64748b">不完整位置不可提交</text>

    <rect x="1014" y="132" width="132" height="104" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="1080" y="164" font-size="15" font-weight="700" fill="#172033">5 分支</text>
    <text x="1080" y="190" font-size="13" fill="#52606d">success?</text>
    <text x="1080" y="213" font-size="12" fill="#64748b">提交或恢复</text>
  </g>

  <g fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M254 184 H294"/>
    <path d="M494 184 H534"/>
    <path d="M734 184 H774"/>
    <path d="M974 184 H1014"/>
  </g>

  <rect x="208" y="314" width="354" height="112" rx="17" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="232" y="347" font-size="15" font-weight="700" fill="#0f5f59">成功：提交新位置</text>
  <text x="232" y="375" font-size="13" fill="#244b49">commit_tokens(target_count)</text>
  <text x="232" y="399" font-size="13" fill="#244b49">新增位置可供 Attention 读取</text>

  <rect x="638" y="314" width="354" height="112" rx="17" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="662" y="347" font-size="15" font-weight="700" fill="#9a4d13">失败或未前进：裁剪</text>
  <text x="662" y="375" font-size="13" fill="#6f5438">trim_to_tokens(previous_count)</text>
  <text x="662" y="399" font-size="13" fill="#6f5438">清理未提交数据并归还多余块</text>

  <path d="M1080 236 V278 H385 V314" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-good)"/>
  <text x="710" y="270" font-size="12" text-anchor="middle" fill="#0f5f59">所有层完成</text>
  <path d="M1080 236 V278 H815 V314" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-bad)"/>
  <text x="950" y="270" font-size="12" text-anchor="middle" fill="#9a4d13">失败 / 未前进</text>

  <rect x="208" y="466" width="784" height="54" rx="14" fill="#173f3c"/>
  <text x="600" y="489" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">请求进入任一终态后：release(request_id)</text>
  <text x="600" y="509" font-size="12" text-anchor="middle" fill="#d9fffa">删除 BlockTable · 清理 K/V 与 written 标记 · 归还全部物理块</text>
  <path d="M385 426 V466" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-good)"/>
  <path d="M815 426 V466" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-bad)"/>
</svg>
