<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 06 一次调度步中的缓存事务</title>
  <desc id="desc">ServiceCore 提供运行请求，Planner 只选择 candidate，Block Pool 先预留，Runtime 和 Executor 执行；成功时提交请求进度和 block token，失败时回滚预留，终态再统一释放资源。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-good" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" font-size="27" font-weight="700" fill="#172033">一次调度步：选择、预留、执行、提交</text>
  <text x="54" y="84" font-size="15" fill="#52606d">Planner 不改状态；执行前预留，执行后根据是否前进选择提交或回滚</text>

  <g text-anchor="middle">
    <rect x="54" y="132" width="180" height="104" rx="16" fill="#ffffff" stroke="#79a4ba" stroke-width="2"/>
    <text x="144" y="164" font-size="15" font-weight="700" fill="#28536b">1 运行请求</text>
    <text x="144" y="190" font-size="13" fill="#52606d">ServiceCore running</text>
    <text x="144" y="213" font-size="12" fill="#64748b">Request · Executor · Sampler</text>

    <rect x="282" y="132" width="180" height="104" rx="16" fill="#e8f1f7" stroke="#79a4ba" stroke-width="2"/>
    <text x="372" y="164" font-size="15" font-weight="700" fill="#28536b">2 选择 candidate</text>
    <text x="372" y="190" font-size="13" fill="#52606d">状态 · token budget</text>
    <text x="372" y="213" font-size="12" fill="#64748b">只生成 StepBatchPlan</text>

    <rect x="510" y="132" width="180" height="104" rx="16" fill="#fff0dc" stroke="#e8a765" stroke-width="2"/>
    <text x="600" y="164" font-size="15" font-weight="700" fill="#9a4d13">3 预留 KV 位置</text>
    <text x="600" y="190" font-size="13" fill="#6f5438">KvBlockPool::reserve</text>
    <text x="600" y="213" font-size="12" fill="#7c6245">尚未增加已提交 token</text>

    <rect x="738" y="124" width="190" height="120" rx="16" fill="#0f766e"/>
    <text x="833" y="160" font-size="15" font-weight="700" fill="#ffffff">4 执行模型</text>
    <text x="833" y="188" font-size="13" fill="#d9fffa">prefill chunk / decode</text>
    <text x="833" y="212" font-size="12" fill="#c5eee8">Runtime → Executor → Context</text>
    <text x="833" y="230" font-size="11" fill="#b5e4de">写入连续或分页 K/V</text>

    <rect x="976" y="132" width="170" height="104" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="1061" y="164" font-size="15" font-weight="700" fill="#0f5f59">5 检查是否前进</text>
    <text x="1061" y="190" font-size="13" fill="#52606d">游标或生成 token</text>
    <text x="1061" y="213" font-size="12" fill="#64748b">advanced?</text>
  </g>

  <g fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M234 184 H282"/>
    <path d="M462 184 H510"/>
    <path d="M690 184 H738"/>
    <path d="M928 184 H976"/>
  </g>

  <rect x="208" y="314" width="354" height="112" rx="17" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="232" y="347" font-size="15" font-weight="700" fill="#0f5f59">成功并前进：提交</text>
  <text x="232" y="375" font-size="13" fill="#244b49">更新 Request 游标或生成 token</text>
  <text x="232" y="399" font-size="13" fill="#244b49">保留 Context K/V · commit_tokens()</text>

  <rect x="638" y="314" width="354" height="112" rx="17" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="662" y="347" font-size="15" font-weight="700" fill="#9a4d13">失败或未前进：回滚</text>
  <text x="662" y="375" font-size="13" fill="#6f5438">Request 进入失败或保持原进度</text>
  <text x="662" y="399" font-size="13" fill="#6f5438">trim_to_tokens() 撤销本步预留</text>

  <path d="M1061 236 V278 H385 V314" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-good)"/>
  <text x="710" y="270" font-size="12" text-anchor="middle" fill="#0f5f59">是</text>
  <path d="M1061 236 V278 H815 V314" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-bad)"/>
  <text x="940" y="270" font-size="12" text-anchor="middle" fill="#9a4d13">否</text>

  <rect x="208" y="466" width="784" height="54" rx="14" fill="#173f3c"/>
  <text x="600" y="489" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">6 仅在终态统一释放</text>
  <text x="600" y="509" font-size="12" text-anchor="middle" fill="#d9fffa">结束 streaming · 清理 Request cache · 释放 Executor/Context · 归还 block</text>
  <path d="M385 426 V466" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-good)"/>
  <text x="397" y="453" font-size="11" fill="#0f5f59">若 terminal</text>
  <path d="M815 426 V466" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-bad)"/>
  <text x="827" y="453" font-size="11" fill="#9a4d13">若 terminal</text>
</svg>
