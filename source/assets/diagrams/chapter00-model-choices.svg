<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 00 四个模型的学习职责</title>
  <desc id="desc">TinyLlama 建立 Llama 稠密主线，Qwen3 引入 QK Norm 与 NeoX RoPE，Qwen1.5 MoE 引入路由和专家，DeepSeek V2 Lite 再引入 MLA 压缩缓存与混合层。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 24px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .heading { font: 700 16px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .label { font: 600 14px "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .small { font: 400 12px "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="20" fill="#f8fafc"/>
  <text x="40" y="43" class="title">四个模型，共用一条推理主干</text>

  <g text-anchor="middle">
    <rect x="120" y="78" width="170" height="62" rx="10" fill="#e2e8f0"/>
    <text x="205" y="104" class="label">GGUF 与分词器</text>
    <text x="205" y="124" class="small">Chapter01</text>
    <rect x="400" y="78" width="170" height="62" rx="10" fill="#dbeafe"/>
    <text x="485" y="104" class="label">Decoder 计算</text>
    <text x="485" y="124" class="small">Chapter04–05</text>
    <rect x="680" y="78" width="170" height="62" rx="10" fill="#dcfce7"/>
    <text x="765" y="104" class="label">生成运行时</text>
    <text x="765" y="124" class="small">Chapter06</text>
    <rect x="960" y="78" width="120" height="62" rx="10" fill="#ffedd5"/>
    <text x="1020" y="104" class="label">服务</text>
    <text x="1020" y="124" class="small">Chapter10</text>
  </g>
  <path d="M290 109H400M570 109H680M850 109H960" class="flow"/>
  <path d="M600 140V184M165 184H1035" class="branch"/>

  <g>
    <rect x="45" y="184" width="255" height="265" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="68" y="218" class="heading">TinyLlama 1.1B</text>
    <text x="68" y="244" class="label">默认必做：Llama 稠密基线</text>
    <text x="68" y="278" class="small">• 22 个解码器块</text>
    <text x="68" y="302" class="small">• RMSNorm、RoPE、GQA</text>
    <text x="68" y="326" class="small">• Q4_K / Q6_K</text>
    <text x="68" y="370" class="label">学习结果</text>
    <text x="68" y="394" class="small">跑通 CPU/CUDA、生成与服务</text>
    <rect x="68" y="414" width="92" height="24" rx="12" fill="#2563eb"/><text x="114" y="431" text-anchor="middle" class="small" fill="#ffffff">首次下载</text>

    <rect x="330" y="184" width="255" height="265" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="353" y="218" class="heading">Qwen3-0.6B</text>
    <text x="353" y="244" class="label">可选：第二种稠密架构</text>
    <text x="353" y="278" class="small">• Q/K 独立归一化</text>
    <text x="353" y="302" class="small">• NeoX RoPE</text>
    <text x="353" y="326" class="small">• 共享 LM Head</text>
    <text x="353" y="370" class="label">学习结果</text>
    <text x="353" y="394" class="small">移除引擎中的 Llama 假设</text>
    <rect x="353" y="414" width="92" height="24" rx="12" fill="#16a34a"/><text x="399" y="431" text-anchor="middle" class="small" fill="#ffffff">稠密扩展</text>

    <rect x="615" y="184" width="255" height="265" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="638" y="218" class="heading">Qwen1.5-MoE</text>
    <text x="638" y="244" class="label">可选：专家模型</text>
    <text x="638" y="278" class="small">• Router 与 Top-K</text>
    <text x="638" y="302" class="small">• 打包专家与共享专家</text>
    <text x="638" y="326" class="small">• 按专家分组执行</text>
    <text x="638" y="370" class="label">学习结果</text>
    <text x="638" y="394" class="small">理解稀疏 FFN 的数据流</text>
    <rect x="638" y="414" width="92" height="24" rx="12" fill="#ea580c"/><text x="684" y="431" text-anchor="middle" class="small" fill="#ffffff">MoE 扩展</text>

    <rect x="900" y="184" width="255" height="265" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="923" y="218" class="heading">DeepSeek-V2-Lite</text>
    <text x="923" y="244" class="label">可选：MLA + MoE</text>
    <text x="923" y="278" class="small">• 低秩 K/V 与 partial RoPE</text>
    <text x="923" y="302" class="small">• 稠密层与专家层混合</text>
    <text x="923" y="326" class="small">• Q2_K / IQ4_NL</text>
    <text x="923" y="370" class="label">学习结果</text>
    <text x="923" y="394" class="small">理解模型架构如何改变缓存</text>
    <rect x="923" y="414" width="92" height="24" rx="12" fill="#dc2626"/><text x="969" y="431" text-anchor="middle" class="small" fill="#ffffff">MLA 扩展</text>
  </g>
</svg>
