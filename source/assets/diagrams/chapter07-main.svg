<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 07 从正确性门槛建立可比较的性能证据</title>
  <desc id="desc">Chapter 07 位于生成运行时和性能归因之间。A 教学负载固定测量契约，B 真实负载验证 TinyLlama Decoder、ServiceCore 和请求并发。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="54" y="55" font-size="27" font-weight="700" fill="#172033">Chapter 07：建立正确性与性能证据</text>
  <text x="54" y="84" font-size="15" fill="#52606d">先证明结果成立，再固定工作负载和测量条件，最后比较性能</text>

  <rect x="54" y="112" width="1092" height="124" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="143" font-size="15" font-weight="700" fill="#52606d">在推理引擎学习主线中的位置</text>
  <g text-anchor="middle">
    <rect x="102" y="163" width="254" height="50" rx="12" fill="#e8f1f7"/>
    <text x="229" y="185" font-size="15" font-weight="700" fill="#28536b">Chapter 06</text>
    <text x="229" y="203" font-size="13" fill="#476878">可运行的生成请求</text>

    <rect x="473" y="155" width="254" height="66" rx="13" fill="#15803d" filter="url(#shadow)"/>
    <text x="600" y="183" font-size="16" font-weight="700" fill="#ffffff">Chapter 07</text>
    <text x="600" y="204" font-size="14" fill="#dcfce7">正确性与基准证据</text>

    <rect x="844" y="163" width="254" height="50" rx="12" fill="#fff0dc"/>
    <text x="971" y="185" font-size="15" font-weight="700" fill="#9a4d13">Chapter 08</text>
    <text x="971" y="203" font-size="13" fill="#8a5b32">性能归因与 A/B 实验</text>
  </g>
  <path d="M356 188 H473" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M727 188 H844" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="54" y="278" font-size="18" font-weight="700" fill="#172033">本章核心：A 教学负载与 B 真实负载共用一条正确性和性能证据链</text>
  <g text-anchor="middle">
    <rect x="54" y="310" width="202" height="108" rx="16" fill="#ffffff" stroke="#dc6b57" stroke-width="2"/>
    <text x="155" y="342" font-size="15" font-weight="700" fill="#9f3427">正确性门槛</text>
    <text x="155" y="369" font-size="13" fill="#52606d">请求完成 · 词元数量</text>
    <text x="155" y="391" font-size="13" fill="#52606d">缓存隔离 · 固定输出</text>

    <rect x="302" y="310" width="202" height="108" rx="16" fill="#e8f1f7" stroke="#79a4ba" stroke-width="2"/>
    <text x="403" y="342" font-size="15" font-weight="700" fill="#28536b">固定工作负载</text>
    <text x="403" y="369" font-size="13" fill="#52606d">模型 · 输入输出长度</text>
    <text x="403" y="391" font-size="13" fill="#52606d">请求数 · 执行方式</text>

    <rect x="550" y="302" width="202" height="124" rx="16" fill="#15803d" filter="url(#shadow)"/>
    <text x="651" y="337" font-size="15" font-weight="700" fill="#ffffff">测量与重复</text>
    <text x="651" y="366" font-size="13" fill="#dcfce7">预热 · 多轮运行</text>
    <text x="651" y="389" font-size="13" fill="#dcfce7">prefill · decode · TTFT</text>
    <text x="651" y="410" font-size="12" fill="#bbf7d0">吞吐与墙钟时间</text>

    <rect x="798" y="310" width="202" height="108" rx="16" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
    <text x="899" y="342" font-size="15" font-weight="700" fill="#0f5f59">机器可读结果</text>
    <text x="899" y="369" font-size="13" fill="#52606d">JSON · 运行命令</text>
    <text x="899" y="391" font-size="13" fill="#52606d">环境与正确性状态</text>

    <rect x="1046" y="310" width="100" height="108" rx="16" fill="#fff0dc" stroke="#e8a765" stroke-width="2"/>
    <text x="1096" y="350" font-size="15" font-weight="700" fill="#9a4d13">决定</text>
    <text x="1096" y="376" font-size="12" fill="#6f5438">保留</text>
    <text x="1096" y="395" font-size="12" fill="#6f5438">回滚 / 复测</text>
  </g>
  <path d="M256 364 H302" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M504 364 H550" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M752 364 H798" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M1000 364 H1046" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="54" y="462" width="1092" height="126" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="493" font-size="15" font-weight="700" fill="#52606d">三类负载必须分开阅读</text>
  <g text-anchor="middle">
    <rect x="92" y="514" width="296" height="50" rx="12" fill="#f1f5f9"/>
    <text x="240" y="536" font-size="14" font-weight="700" fill="#334155">A 教学轮询 1 / 2 / 4 请求</text>
    <text x="240" y="554" font-size="12" fill="#64748b">检查 schema 与调度行为</text>

    <rect x="452" y="514" width="296" height="50" rx="12" fill="#e7f6f3"/>
    <text x="600" y="536" font-size="14" font-weight="700" fill="#0f5f59">B 真实 TinyLlama 双 worker</text>
    <text x="600" y="554" font-size="12" fill="#52606d">请求级并发，不是 Tensor batch</text>

    <rect x="812" y="514" width="296" height="50" rx="12" fill="#fff7ed" stroke="#e8a765" stroke-dasharray="7 5"/>
    <text x="960" y="536" font-size="14" font-weight="700" fill="#9a4d13">A 教学 Tensor batch</text>
    <text x="960" y="554" font-size="12" fill="#6f5438">一次模型调用 · 与逐请求 golden 一致</text>
  </g>

  <rect x="54" y="612" width="1092" height="42" rx="12" fill="#173f3c"/>
  <text x="600" y="638" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">学习结果：能判断两组性能数字是否可比，并指出当前证据能证明到哪里</text>
</svg>
