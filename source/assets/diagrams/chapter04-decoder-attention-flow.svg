<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 04 单层解码器的双残差数据流</title>
  <desc id="desc">输入依次经过第一次归一化、注意力和残差相加，再经过第二次归一化、前馈网络和残差相加；无状态前向与请求级连续 KV 路径共享同一层权重。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52606d"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c45b16"/></marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
    <style>
      .title { font-family: sans-serif; font-size: 25px; font-weight: 700; fill: #172033; }
      .label { font-family: sans-serif; font-size: 15px; font-weight: 700; }
      .text { font-family: sans-serif; font-size: 13px; fill: #52606d; }
      .light { font-family: sans-serif; font-size: 13px; fill: #fff7ed; }
      .main { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .residual1 { stroke: #c45b16; stroke-width: 2.7; fill: none; marker-end: url(#arrow-orange); }
      .residual2 { stroke: #0f766e; stroke-width: 2.7; fill: none; marker-end: url(#arrow-teal); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#f8fafc"/>
  <text x="44" y="48" class="title">单层解码器：两次前置归一化，两次残差相加</text>
  <text x="44" y="76" class="text">沿主路径读取子模块，沿彩色旁路确认每次加法保留的是哪一个 hidden state</text>

  <rect x="44" y="106" width="1112" height="292" rx="18" fill="#fffaf5" stroke="#fed7aa"/>
  <g text-anchor="middle">
    <rect x="72" y="172" width="96" height="64" rx="12" fill="#fff" stroke="#93b6c8" stroke-width="2"/>
    <text x="120" y="199" class="label" fill="#28536b">输入 x</text><text x="120" y="220" class="text">[T,D]</text>

    <rect x="204" y="172" width="112" height="64" rx="12" fill="#fff0dc" stroke="#e8a765"/>
    <text x="260" y="198" class="label" fill="#9a4d13">Norm 1</text><text x="260" y="219" class="text">Pre-Norm</text>

    <rect x="352" y="160" width="136" height="88" rx="13" fill="#c45b16"/>
    <text x="420" y="196" class="label" fill="#fff">注意力</text><text x="420" y="220" class="light">词元间聚合</text>

    <circle cx="538" cy="204" r="27" fill="#fff" stroke="#c45b16" stroke-width="2"/>
    <text x="538" y="213" font-family="sans-serif" font-size="27" font-weight="700" fill="#c45b16">+</text>

    <rect x="598" y="172" width="112" height="64" rx="12" fill="#fff0dc" stroke="#e8a765"/>
    <text x="654" y="198" class="label" fill="#9a4d13">Norm 2</text><text x="654" y="219" class="text">Pre-Norm</text>

    <rect x="746" y="160" width="136" height="88" rx="13" fill="#0f766e"/>
    <text x="814" y="196" class="label" fill="#fff">FFN</text><text x="814" y="220" class="light">逐词元变换</text>

    <circle cx="932" cy="204" r="27" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="932" y="213" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f766e">+</text>

    <rect x="992" y="172" width="112" height="64" rx="12" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
    <text x="1048" y="199" class="label" fill="#0f5f59">输出 y</text><text x="1048" y="220" class="text">[T,D]</text>
  </g>

  <path d="M168 204H204M316 204H352M488 204H511M565 204H598M710 204H746M882 204H905M959 204H992" class="main"/>
  <circle cx="180" cy="204" r="4" fill="#c45b16"/>
  <path d="M180 204V308H538V231" class="residual1"/>
  <text x="328" y="300" class="text" fill="#9a4d13">保留 x：h = x + Attention(Norm1(x))</text>
  <circle cx="580" cy="204" r="4" fill="#0f766e"/>
  <path d="M580 204V346H932V231" class="residual2"/>
  <text x="722" y="338" class="text" fill="#0f5f59">保留 h：y = h + FFN(Norm2(h))</text>

  <rect x="44" y="426" width="348" height="94" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="68" y="456" class="label" fill="#1d4ed8">教学解码器层</text>
  <text x="68" y="481" class="text">LayerNorm · MHA · ReLU FFN</text>
  <text x="68" y="503" class="text">保留无状态 forward，便于检查双残差</text>

  <rect x="426" y="426" width="348" height="94" rx="15" fill="#fff7ed" stroke="#fdba74"/>
  <text x="450" y="456" class="label" fill="#c2410c">TinyLlama 真实 Block</text>
  <text x="450" y="481" class="text">RMSNorm · GQA + RoPE · SwiGLU</text>
  <text x="450" y="503" class="text">量化 Linear 由 Chapter 05 backend 执行</text>

  <rect x="808" y="426" width="348" height="94" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="832" y="456" class="label" fill="#047857">单层请求 Context</text>
  <text x="832" y="481" class="text">prefill 写入多个 K/V · decode 追加一个</text>
  <text x="832" y="503" class="text">成功后提交；分页管理进入 Chapter 07</text>
</svg>
