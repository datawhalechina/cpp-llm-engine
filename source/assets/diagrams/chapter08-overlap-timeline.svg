<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Chapter08 重叠调度的快照与失效</title>
  <desc id="desc">同步路径在第 N 步提交后才规划下一步。重叠控制面在第 N 步执行期间预计算 N+1，但提交后必须重新校验请求、执行器、页表和策略版本；一致才执行，否则丢弃并重新规划。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #172033; }
      .label { font-size: 16px; font-weight: 700; fill: #172033; }
      .text { font-size: 13px; fill: #475569; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="610" rx="24" fill="#f8fafc"/>
  <text x="48" y="52" class="title">Chapter08 · 预计算下一步为什么仍要重新校验</text>
  <text x="48" y="80" class="text">当前实现重叠的是控制面规划，不代表 CPU Scheduler 已与 GPU Kernel 并行</text>

  <text x="48" y="134" class="label">同步路径</text>
  <line x1="158" y1="129" x2="1138" y2="129" stroke="#cbd5e1" stroke-width="2"/>
  <g text-anchor="middle">
    <rect x="180" y="106" width="150" height="48" rx="12" fill="#e8f1ff" stroke="#60a5fa"/><text x="255" y="136" class="text">计划 N</text>
    <rect x="386" y="106" width="180" height="48" rx="12" fill="#0f766e"/><text x="476" y="136" font-size="13" fill="#fff">执行 N</text>
    <rect x="622" y="106" width="150" height="48" rx="12" fill="#ecfdf5" stroke="#10b981"/><text x="697" y="136" class="text">提交 N</text>
    <rect x="828" y="106" width="190" height="48" rx="12" fill="#e8f1ff" stroke="#60a5fa"/><text x="923" y="136" class="text">计划 N+1</text>
  </g>
  <path d="M330 130H381" class="line"/><path d="M566 130H617" class="line"/><path d="M772 130H823" class="line"/>

  <text x="48" y="226" class="label">控制面重叠</text>
  <line x1="158" y1="221" x2="1138" y2="221" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="180" y="198" width="150" height="48" rx="12" fill="#e8f1ff" stroke="#60a5fa"/><text x="255" y="228" text-anchor="middle" class="text">计划 N</text>
  <rect x="386" y="198" width="270" height="48" rx="12" fill="#0f766e"/><text x="521" y="228" text-anchor="middle" font-size="13" fill="#fff">执行 N</text>
  <rect x="712" y="198" width="150" height="48" rx="12" fill="#ecfdf5" stroke="#10b981"/><text x="787" y="228" text-anchor="middle" class="text">提交 N</text>
  <path d="M330 222H381" class="line"/><path d="M656 222H707" class="line"/>
  <rect x="402" y="278" width="270" height="76" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="537" y="308" text-anchor="middle" class="label">预计算 N+1</text><text x="537" y="333" text-anchor="middle" class="text">保存 batch ID 与四类状态快照</text>
  <path d="M430 246V273" class="line"/>
  <rect x="730" y="278" width="250" height="76" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="855" y="308" text-anchor="middle" class="label">提交后重新校验</text><text x="855" y="333" text-anchor="middle" class="text">快照是否仍与当前状态一致</text>
  <path d="M672 316H725" class="line"/><path d="M787 246V273" class="line"/>

  <rect x="74" y="422" width="500" height="126" rx="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="458" class="label" fill="#065f46">快照一致：Executed</text>
  <text x="100" y="488" class="text">Request、Executor、BlockTable、Policy version 均未变化</text>
  <text x="100" y="516" class="text">直接 dispatch 已准备的 N+1 计划</text>
  <rect x="626" y="422" width="500" height="126" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="652" y="458" class="label" fill="#92400e">任一变化：Stale</text>
  <text x="652" y="488" class="text">取消、前序推进、K/V 计数或优先级版本已经变化</text>
  <text x="652" y="516" class="text">丢弃旧计划，下一次按当前状态重新规划</text>
  <path d="M855 354V388H324V417" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M855 354V417" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)"/>
</svg>
