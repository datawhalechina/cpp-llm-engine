<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 05 仅权重量化路径</title>
  <desc id="desc">浮点权重转换为带缩放因子的量化值，经加载和张量校验后进入反量化或量化计算路径，并与浮点基线比较准确性和性能。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #172033; }
      .label { font-size: 16px; font-weight: 700; }
      .text { font-size: 14px; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .check { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="580" rx="20" fill="#f8fafc"/>
  <text x="40" y="42" class="title">Chapter 05：仅权重量化路径</text>

  <rect x="40" y="70" width="1200" height="180" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="104" class="label" fill="#1d4ed8">权重表示路径</text>
  <g text-anchor="middle" class="text">
    <rect x="75" y="145" width="180" height="64" rx="11" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="165" y="172">浮点权重</text><text x="165" y="194" fill="#475569">FP16 / FP32</text>
    <rect x="325" y="145" width="180" height="64" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="415" y="172">量化与导出</text><text x="415" y="194" fill="#1e40af">缩放因子 · 类型 · 分组</text>
    <rect x="575" y="133" width="190" height="88" rx="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="670" y="169" fill="#fff" font-weight="700">INT8 权重</text><text x="670" y="193" fill="#dbeafe">整数值 + 缩放因子</text>
    <rect x="835" y="145" width="165" height="64" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="917" y="172">加载器</text><text x="917" y="194" fill="#1e40af">元数据校验</text>
    <rect x="1070" y="145" width="120" height="64" rx="11" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="1130" y="172">张量</text><text x="1130" y="194" fill="#475569">类型 / 缓冲区</text>
  </g>
  <path d="M255 177H325M505 177H575M765 177H835M1000 177H1070" class="arrow"/>

  <rect x="40" y="290" width="760" height="220" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="64" y="324" class="label" fill="#c2410c">计算路径</text>
  <g text-anchor="middle" class="text">
    <rect x="85" y="375" width="190" height="72" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="180" y="404" fill="#9a3412" font-weight="700">反量化算子</text><text x="180" y="427" fill="#9a3412">INT8 → 浮点计算类型</text>
    <rect x="330" y="375" width="190" height="72" rx="11" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="425" y="404" fill="#9a3412" font-weight="700">量化线性层</text><text x="425" y="427" fill="#9a3412">权重 + 激活</text>
    <rect x="575" y="375" width="175" height="72" rx="11" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="662" y="404" fill="#fff" font-weight="700">输出</text><text x="662" y="427" fill="#ffedd5">保持算子契约</text>
  </g>
  <path d="M1130 209V270H180V375M180 447H330M520 411H575" class="arrow"/>
  <path d="M670 221V300H425V375" class="dashed"/>
  <text x="438" y="292" class="text" fill="#6d28d9">专用 INT8 内核可替代完整反量化路径</text>

  <rect x="840" y="290" width="400" height="220" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="864" y="324" class="label" fill="#047857">如何判断是否采用</text>
  <text x="864" y="365" class="text" fill="#065f46">成本：权重存储和带宽</text>
  <text x="864" y="397" class="text" fill="#065f46">精度：缩放因子、误差、浮点基线</text>
  <text x="864" y="429" class="text" fill="#065f46">性能：内核、内存、吞吐、延迟</text>
  <text x="864" y="461" class="text" fill="#065f46">后续：KV Cache 量化连接运行时状态</text>
  <path d="M750 411H840" class="check"/>

  <rect x="40" y="535" width="1200" height="1" fill="#cbd5e1"/>
  <text x="64" y="562" class="text" fill="#047857">最终验证：量化表示进入同一条 Linear 语义，并用准确率、显存和性能共同决定是否值得部署</text>
</svg>
