<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Foundation 内容与推理引擎主线</title>
  <desc id="desc">Foundation 提供工程基础、对象与数据、工程组装与并发基础三组 CPU 准备内容，并提供 CUDA 环境与常用库选修。完成所需准备后进入 Chapter 00 到 Chapter 10 的推理引擎主线。</desc>
  <defs>
    <marker id="arrow-main" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-optional" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#123047" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="24" fill="#f7f4ec"/>
  <text x="48" y="48" font-family="'Noto Sans SC', sans-serif" font-size="25" font-weight="700" fill="#123047">先补需要的基础，再进入 Chapter 00</text>
  <text x="48" y="76" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#526271">先运行 CPU 主线；开始学习 GPU 时，再加入 CUDA 环境和常用库。</text>

  <rect x="40" y="104" width="1120" height="250" rx="18" fill="#fffdf8" stroke="#d8d1c3" stroke-width="1.5"/>
  <text x="66" y="140" font-family="'Noto Sans SC', sans-serif" font-size="17" font-weight="700" fill="#123047">Foundation 学什么</text>
  <text x="1082" y="140" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="end" fill="#64748b">前三组组成 CPU 准备路线</text>

  <g filter="url(#shadow)" font-family="'Noto Sans SC', sans-serif">
    <rect x="66" y="170" width="245" height="126" rx="14" fill="#e8f1ee"/>
    <text x="88" y="203" font-size="17" font-weight="700" fill="#0f5f59">工程基础</text>
    <text x="88" y="232" font-size="14" fill="#274c4a">F01 C++ · F02 CMake</text>
    <text x="88" y="258" font-size="14" fill="#274c4a">F04 调试与测试</text>

    <rect x="339" y="170" width="245" height="126" rx="14" fill="#d9ece7"/>
    <text x="361" y="203" font-size="17" font-weight="700" fill="#0f5f59">对象与数据</text>
    <text x="361" y="232" font-size="14" fill="#274c4a">F05 对象设计 · F06 数据结构</text>
    <text x="361" y="258" font-size="14" fill="#274c4a">F08 PyTorch / C++ 映射</text>

    <rect x="612" y="170" width="225" height="126" rx="14" fill="#c7e5dd"/>
    <text x="634" y="203" font-size="17" font-weight="700" fill="#0f5f59">工程与并发</text>
    <text x="634" y="232" font-size="14" fill="#274c4a">F09 最小工程 · F10 并发基础</text>
    <text x="634" y="258" font-size="14" fill="#274c4a">library · app · test · worker</text>

    <rect x="883" y="170" width="251" height="126" rx="14" fill="#fff0cf" stroke="#d79a27" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="905" y="203" font-size="17" font-weight="700" fill="#9a4e08">GPU 选修</text>
    <text x="905" y="232" font-size="14" fill="#75400d">F03 CUDA 环境</text>
    <text x="905" y="258" font-size="14" fill="#75400d">F07 CUDA 常用库</text>
  </g>

  <path d="M311 233H339" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <path d="M584 233H612" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <text x="1008" y="322" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="middle" fill="#9a4e08">开始 GPU backend 前加入</text>

  <rect x="40" y="384" width="1120" height="270" rx="18" fill="#123047"/>
  <text x="66" y="420" font-family="'Noto Sans SC', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">进入教程主线</text>
  <text x="1134" y="420" font-family="'Noto Sans SC', sans-serif" font-size="13" text-anchor="end" fill="#b8c8d2">从真实模型开始，逐步构建推理服务</text>

  <path d="M724 296V402H171V446" fill="none" stroke="#38b2a0" stroke-width="3" marker-end="url(#arrow-main)"/>

  <g filter="url(#shadow)" font-family="'Noto Sans SC', sans-serif">
    <rect x="66" y="450" width="210" height="104" rx="14" fill="#f8fafc"/>
    <text x="88" y="483" font-size="16" font-weight="700" fill="#123047">Chapter 00</text>
    <text x="88" y="512" font-size="14" fill="#526271">真实模型基线</text>
    <text x="88" y="536" font-size="13" fill="#64748b">llama.cpp · TinyLlama</text>

    <rect x="315" y="450" width="230" height="104" rx="14" fill="#e8f1ee"/>
    <text x="337" y="483" font-size="16" font-weight="700" fill="#0f5f59">Chapter 01-03</text>
    <text x="337" y="512" font-size="14" fill="#274c4a">Loader · Tensor · Operator</text>
    <text x="337" y="536" font-size="13" fill="#4f6d6a">建立引擎对象</text>

    <rect x="584" y="450" width="230" height="104" rx="14" fill="#c7e5dd"/>
    <text x="606" y="483" font-size="16" font-weight="700" fill="#0f5f59">Chapter 04-06</text>
    <text x="606" y="512" font-size="14" fill="#274c4a">Decoder · 量化 · Runtime</text>
    <text x="606" y="536" font-size="13" fill="#4f6d6a">完成模型执行</text>

    <rect x="853" y="450" width="281" height="104" rx="14" fill="#83c9b8"/>
    <text x="875" y="483" font-size="16" font-weight="700" fill="#073c38">Chapter 07-10</text>
    <text x="875" y="512" font-size="14" fill="#123f3b">KV · Scheduler · Evidence · Serving</text>
    <text x="875" y="536" font-size="13" fill="#315d58">形成缓存、调度、验证与服务闭环</text>
  </g>

  <path d="M276 502H315" stroke="#68a99a" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <path d="M545 502H584" stroke="#68a99a" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <path d="M814 502H853" stroke="#68a99a" stroke-width="2.5" marker-end="url(#arrow-main)"/>

  <path d="M1008 296V365H699V446" fill="none" stroke="#d79a27" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-optional)"/>
  <rect x="409" y="588" width="382" height="40" rx="20" fill="#fff0cf"/>
  <text x="600" y="613" font-family="'Noto Sans SC', sans-serif" font-size="14" text-anchor="middle" fill="#8a4708">F03 / F07 → code/cuda → 替换 Backend 与 Kernel</text>
</svg>
