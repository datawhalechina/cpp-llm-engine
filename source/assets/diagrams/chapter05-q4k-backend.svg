<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 05 单行与批量量化 Linear 后端分派</title>
  <desc id="desc">单行 LinearRequest 与多行 LinearBatchRequest 进入 CPU 量化策略。Scalar 后端具有专用多行实现，AVX2 批量请求当前逐行调用已有 SIMD 内核；reference 与 CUDA baseline 是从相同输入分出的独立对照路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 26px; font-weight: 700; fill: #172033; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 17px; font-weight: 700; fill: #172033; }
      .text { font-family: "Noto Sans CJK SC"; font-size: 14px; fill: #334155; }
      .small { font-family: "Noto Sans CJK SC"; font-size: 13px; fill: #475569; }
      .line { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #64748b; stroke-width: 2.4; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#f8fafc"/>
  <text x="42" y="48" class="title">Chapter 05 · 单行与批量量化 Linear 后端分派</text>
  <text x="42" y="76" class="small">输入 shape 决定请求契约；量化格式和 policy 决定执行后端</text>

  <rect x="58" y="112" width="472" height="112" rx="16" fill="#e8f1ff" stroke="#93c5fd"/>
  <text x="82" y="146" class="label">单行输入</text>
  <text x="82" y="175" class="text">激活 [cols] → 输出 [rows]</text>
  <text x="82" y="201" class="small">LinearRequest · 单个 token / 单个请求</text>
  <rect x="670" y="112" width="472" height="112" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="694" y="146" class="label">多行输入</text>
  <text x="694" y="175" class="text">激活 [batch, cols] → 输出 [batch, rows]</text>
  <text x="694" y="201" class="small">LinearBatchRequest · 多个 Context 的同阶段激活</text>

  <rect x="300" y="270" width="600" height="82" rx="16" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="600" y="303" text-anchor="middle" class="label">CPU 量化格式与后端策略</text>
  <text x="600" y="331" text-anchor="middle" class="small">QuantizedLinearPolicy → scalar / available AVX2 backend</text>
  <path d="M294 224V248H535V265" class="line"/>
  <path d="M906 224V248H665V265" class="line"/>

  <path d="M600 352V376" class="bus"/>
  <path d="M456 376H744" class="bus"/>
  <circle cx="456" cy="376" r="4" fill="#64748b"/><circle cx="744" cy="376" r="4" fill="#64748b"/>
  <path d="M456 376V397" class="line"/><path d="M744 376V397" class="line"/>
  <path d="M120 224V376H168V397" class="line"/>
  <path d="M1080 224V376H1032V397" class="line"/>

  <rect x="42" y="402" width="252" height="154" rx="15" fill="#dcfce7" stroke="#86efac"/>
  <text x="168" y="436" text-anchor="middle" class="label">Reference</text>
  <text x="168" y="467" text-anchor="middle" class="text">完整反量化为 Float32</text>
  <text x="168" y="493" text-anchor="middle" class="text">再执行逐行点积</text>
  <text x="168" y="527" text-anchor="middle" class="small">数值基线，不是默认路径</text>
  <rect x="330" y="402" width="252" height="154" rx="15" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="456" y="436" text-anchor="middle" class="label">Scalar fused</text>
  <text x="456" y="467" text-anchor="middle" class="text">单行：解码后立即累加</text>
  <text x="456" y="493" text-anchor="middle" class="text">多行：一次遍历更新各行</text>
  <text x="456" y="527" text-anchor="middle" class="small">已有专用 batch kernel</text>
  <rect x="618" y="402" width="252" height="154" rx="15" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="744" y="436" text-anchor="middle" class="label">AVX2 / FMA fused</text>
  <text x="744" y="467" text-anchor="middle" class="text">单行：SIMD 解码与乘加</text>
  <text x="744" y="493" text-anchor="middle" class="text">多行：当前逐行兼容调用</text>
  <text x="744" y="527" text-anchor="middle" class="small">尚无专用 SIMD batch kernel</text>
  <rect x="906" y="402" width="252" height="154" rx="15" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1032" y="436" text-anchor="middle" class="label">CUDA</text>
  <text x="1032" y="467" text-anchor="middle" class="text">单 token：融合 GEMV</text>
  <text x="1032" y="493" text-anchor="middle" class="text">batch：反量化 + SGEMM</text>
  <text x="1032" y="527" text-anchor="middle" class="small">同一 Linear 契约，两条执行路径</text>

  <rect x="130" y="604" width="940" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="630" text-anchor="middle" class="label">统一输出契约：Float32 logits / hidden rows</text>
  <text x="600" y="650" text-anchor="middle" class="small">同一 payload、shape 和正确性门槛；性能结论按后端与 workload 分别验证</text>
  <path d="M168 556V599" class="line"/><path d="M456 556V599" class="line"/>
  <path d="M744 556V599" class="line"/><path d="M1032 556V599" class="line"/>
</svg>
