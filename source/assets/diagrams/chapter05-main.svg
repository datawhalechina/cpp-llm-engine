<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 05 用同一输入比较浮点与量化 Linear</title>
  <desc id="desc">Chapter 05 位于 Decoder 结构和 Generation Runtime 之间。A 线解释量化误差，B 线接入真实 GGUF 权重，G 线替换 Linear 执行后端，M 线复用 Q8_0 权重路径。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#28536b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c45b16"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="54" y="55" font-size="27" font-weight="700" fill="#172033">Chapter 05：用同一输入比较浮点与量化 Linear</text>
  <text x="54" y="84" font-size="15" fill="#52606d">权重表示和执行后端可以改变，Linear 输入输出与 Runtime 调用方式保持不变</text>

  <!-- Position in the engine -->
  <rect x="54" y="112" width="1092" height="124" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="143" font-size="15" font-weight="700" fill="#52606d">在推理引擎中的位置</text>
  <g text-anchor="middle">
    <rect x="102" y="163" width="254" height="50" rx="12" fill="#e7f6f3"/>
    <text x="229" y="185" font-size="15" font-weight="700" fill="#0f5f59">Chapter 04</text>
    <text x="229" y="203" font-size="13" fill="#376963">Decoder 结构与 Linear 语义</text>

    <rect x="473" y="155" width="254" height="66" rx="13" fill="#c45b16" filter="url(#shadow)"/>
    <text x="600" y="183" font-size="16" font-weight="700" fill="#ffffff">Chapter 05</text>
    <text x="600" y="204" font-size="14" fill="#fff2e8">量化权重与 Linear 后端</text>

    <rect x="844" y="163" width="254" height="50" rx="12" fill="#e8f1f7"/>
    <text x="971" y="185" font-size="15" font-weight="700" fill="#28536b">Chapter 06</text>
    <text x="971" y="203" font-size="13" fill="#476878">请求状态与 Generation Runtime</text>
  </g>
  <path d="M356 188 H473" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M727 188 H844" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parallel reference and quantized paths -->
  <text x="54" y="278" font-size="18" font-weight="700" fill="#172033">本章核心：A 教学参考与 B 真实量化使用同一输入，再比较结果与成本</text>

  <rect x="54" y="338" width="126" height="84" rx="15" fill="#ffffff" stroke="#93b6c8" stroke-width="2"/>
  <text x="117" y="369" font-size="15" font-weight="700" text-anchor="middle" fill="#28536b">浮点输入 x</text>
  <text x="117" y="395" font-size="12" text-anchor="middle" fill="#52606d">同一 shape · 同一数值</text>

  <path d="M180 380 H220" fill="none" stroke="#52606d" stroke-width="2.5"/>
  <circle cx="220" cy="380" r="4" fill="#52606d"/>
  <path d="M220 380 V330 H270" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M220 380 V430 H270" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <g text-anchor="middle">
    <rect x="270" y="294" width="170" height="72" rx="14" fill="#e8f1f7" stroke="#79a4ba"/>
    <text x="355" y="322" font-size="14" font-weight="700" fill="#28536b">A 浮点参考</text>
    <text x="355" y="347" font-size="12" fill="#52606d">Float32 / reference</text>

    <rect x="488" y="294" width="170" height="72" rx="14" fill="#e8f1f7" stroke="#79a4ba"/>
    <text x="573" y="322" font-size="14" font-weight="700" fill="#28536b">浮点 Linear</text>
    <text x="573" y="347" font-size="12" fill="#52606d">产生基线输出</text>

    <rect x="706" y="294" width="144" height="72" rx="14" fill="#ffffff" stroke="#79a4ba"/>
    <text x="778" y="322" font-size="14" font-weight="700" fill="#28536b">基线结果</text>
    <text x="778" y="347" font-size="12" fill="#52606d">y_ref</text>

    <rect x="270" y="394" width="170" height="72" rx="14" fill="#fff0dc" stroke="#e8a765"/>
    <text x="355" y="422" font-size="14" font-weight="700" fill="#9a4d13">B GGUF 量化权重</text>
    <text x="355" y="447" font-size="12" fill="#6f5438">整数值 + scale + block</text>

    <rect x="488" y="386" width="170" height="88" rx="14" fill="#c45b16" filter="url(#shadow)"/>
    <text x="573" y="417" font-size="14" font-weight="700" fill="#ffffff">量化 Linear</text>
    <text x="573" y="442" font-size="12" fill="#fff2e8">reference / fused / CUDA</text>
    <text x="573" y="460" font-size="11" fill="#ffe1cf">外部接口保持一致</text>

    <rect x="706" y="394" width="144" height="72" rx="14" fill="#ffffff" stroke="#e8a765"/>
    <text x="778" y="422" font-size="14" font-weight="700" fill="#9a4d13">量化结果</text>
    <text x="778" y="447" font-size="12" fill="#6f5438">y_quant</text>

    <rect x="914" y="306" width="232" height="148" rx="17" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="1030" y="339" font-size="15" font-weight="700" fill="#0f5f59">用证据决定是否保留</text>
    <text x="1030" y="369" font-size="13" fill="#52606d">输出误差</text>
    <text x="1030" y="395" font-size="13" fill="#52606d">权重 payload 大小</text>
    <text x="1030" y="421" font-size="13" fill="#52606d">延迟与执行路径</text>
  </g>

  <path d="M440 330 H488" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M658 330 H706" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M440 430 H488" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M658 430 H706" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M850 330 H914" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M850 430 H914" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <rect x="54" y="500" width="1092" height="150" rx="16" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="530" font-size="14" font-weight="700" fill="#52606d">四条学习线在本章的交接点</text>
  <g text-anchor="middle">
    <rect x="78" y="550" width="244" height="72" rx="12" fill="#e8f1f7" stroke="#79a4ba"/>
    <text x="200" y="578" font-size="14" font-weight="700" fill="#28536b">A 教学证据</text>
    <text x="200" y="601" font-size="12" fill="#52606d">小 block · 误差 · 失败路径</text>
    <rect x="344" y="550" width="244" height="72" rx="12" fill="#fff0dc" stroke="#e8a765"/>
    <text x="466" y="578" font-size="14" font-weight="700" fill="#9a4d13">B 真实执行</text>
    <text x="466" y="601" font-size="12" fill="#6f5438">GGUF Q4_K / Q6_K / Q8_0</text>
    <rect x="610" y="550" width="244" height="72" rx="12" fill="#ecfdf5" stroke="#6db5a9"/>
    <text x="732" y="578" font-size="14" font-weight="700" fill="#0f5f59">G GPU 后端</text>
    <text x="732" y="601" font-size="12" fill="#376963">融合 GEMV / batch cuBLAS</text>
    <rect x="876" y="550" width="244" height="72" rx="12" fill="#fef3c7" stroke="#d4a72c"/>
    <text x="998" y="578" font-size="14" font-weight="700" fill="#805b10">M 多模态复用</text>
    <text x="998" y="601" font-size="12" fill="#6f5b2d">SmolVLM Q8_0 权重</text>
  </g>
</svg>
