<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 03 算子、计算后端与内核的执行分层</title>
  <desc id="desc">CPU 与 CUDA 共享 MatmulRequest 的形状数据和数值验收语义，并通过各自的执行接口进入主机内核与 cuBLAS。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
    <style>
      .title { font-family: sans-serif; font-size: 25px; font-weight: 700; fill: #172033; }
      .section { font-family: sans-serif; font-size: 17px; font-weight: 700; }
      .label { font-family: sans-serif; font-size: 15px; font-weight: 700; }
      .text { font-family: sans-serif; font-size: 13px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .verified { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#arrow-teal); }
      .planned { stroke: #94a3b8; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="620" rx="22" fill="#f8fafc"/>
  <text x="48" y="50" class="title">Chapter 03：共享形状语义，分开执行接口</text>
  <text x="48" y="78" class="text">CPU 与 CUDA 复用 MatmulRequest 数据；主机后端和带 Stream 的 cuBLAS 接口分别执行</text>

  <rect x="48" y="110" width="1184" height="116" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="72" y="142" class="section" fill="#1d4ed8">计算语义</text>
  <g text-anchor="middle">
    <rect x="116" y="160" width="218" height="48" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="225" y="181" class="label" fill="#334155">上层模型计算</text><text x="225" y="199" class="text">Linear · QKV · FFN</text>
    <rect x="466" y="150" width="348" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="640" y="178" class="label" fill="#1d4ed8">MatmulRequest</text><text x="640" y="200" class="text">A[M,K] × B[K,N] = C[M,N] · row-major · Float32</text>
    <rect x="946" y="160" width="218" height="48" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="1055" y="181" class="label" fill="#334155">统一验收语义</text><text x="1055" y="199" class="text">形状 · 状态 · 数值</text>
  </g>
  <path d="M334 184H466" class="arrow"/><path d="M814 184H946" class="arrow"/>

  <text x="48" y="270" class="section" fill="#334155">计算后端根据内存位置进入不同执行上下文</text>
  <rect x="48" y="294" width="552" height="184" rx="16" fill="#eef6fb" stroke="#9ec5d8"/>
  <text x="72" y="326" class="section" fill="#28536b">CPU 主机路径 · 已验证</text>
  <g text-anchor="middle">
    <rect x="82" y="356" width="142" height="70" rx="11" fill="#fff" stroke="#7aa6bb"/>
    <text x="153" y="384" class="label" fill="#28536b">主机视图</text><text x="153" y="406" class="text">Matrix / ViewRef</text>
    <rect x="260" y="348" width="166" height="86" rx="11" fill="#dcecf4" stroke="#4f849e" stroke-width="2"/>
    <text x="343" y="380" class="label" fill="#28536b">CPU 计算后端</text><text x="343" y="402" class="text">请求校验与分派</text>
    <rect x="462" y="356" width="104" height="70" rx="11" fill="#fff" stroke="#7aa6bb"/>
    <text x="514" y="384" class="label" fill="#28536b">计算内核</text><text x="514" y="406" class="text">三重循环</text>
  </g>
  <path d="M224 391H260M426 391H462" class="verified"/>

  <rect x="632" y="294" width="600" height="184" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="326" class="section" fill="#c2410c">CUDA 设备路径 · cuBLAS 已验证</text>
  <g text-anchor="middle">
    <rect x="670" y="356" width="150" height="70" rx="11" fill="#fff" stroke="#f0a45d"/>
    <text x="745" y="384" class="label" fill="#9a4d13">设备缓冲区</text><text x="745" y="406" class="text">设备指针 + CUDA 流</text>
    <rect x="854" y="348" width="186" height="86" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="947" y="380" class="label" fill="#9a3412">cuBLAS 后端</text><text x="947" y="402" class="text">行/列优先映射</text>
    <rect x="1074" y="356" width="124" height="70" rx="11" fill="#fff" stroke="#f0a45d"/>
    <text x="1136" y="384" class="label" fill="#9a4d13">计算库</text><text x="1136" y="406" class="text">cublasSgemm</text>
  </g>
  <path d="M820 391H854M1040 391H1074" class="verified"/>

  <rect x="48" y="510" width="1184" height="74" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="72" y="540" class="label" fill="#047857">共同验证：形状和数值一致；CPU Status 与 CUDA CublasStatus 分别报告错误</text>
  <text x="72" y="566" class="text">未来自定义 CUDA kernel</text>
  <path d="M250 562H420" class="planned"/>
  <text x="442" y="566" class="text">复用同一 MatmulRequest 数学语义和数值回归，不改变上层模型调用</text>
</svg>
