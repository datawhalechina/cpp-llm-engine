<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">张量视图共享存储与显式连续化</title>
  <desc id="desc">原始、转置和切片 View 分别用 shape stride offset 引用同一 Storage；非连续转置 View 经过 contiguous 后按逻辑顺序复制到新的连续 Storage。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .heading { font-size: 27px; font-weight: 700; fill: #172033; }
      .section { font-size: 16px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-sub { font-size: 12px; fill: #52606d; }
      .note { font-size: 13px; fill: #52606d; }
      .ref { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#ref-arrow); }
      .flow { fill: none; stroke: #c45b16; stroke-width: 2.5; marker-end: url(#flow-arrow); }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f7f4ec"/></linearGradient>
    <marker id="ref-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c45b16"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#background)"/>
  <text x="52" y="55" class="heading">视图改变观察方式，连续化才复制数据</text>
  <text x="52" y="84" class="note">绿色箭头表示引用同一存储；橙色箭头表示按逻辑索引复制到新存储</text>

  <rect x="52" y="112" width="690" height="516" rx="18" fill="#ffffff" stroke="#b9d8d1"/>
  <text x="76" y="145" class="section">三个视图，共享六个元素</text>

  <g text-anchor="middle">
    <rect x="76" y="174" width="190" height="112" rx="14" fill="#e8f1f7" stroke="#7aa6bc"/>
    <text x="171" y="203" class="node-title" fill="#28536b">原始视图</text>
    <text x="171" y="228" class="node-sub">shape [2,3]</text>
    <text x="171" y="248" class="node-sub">stride [3,1] · offset 0</text>
    <text x="171" y="270" font-size="12" font-weight="700" fill="#0f766e">连续</text>

    <rect x="302" y="174" width="190" height="112" rx="14" fill="#fff0dc" stroke="#e8a765"/>
    <text x="397" y="203" class="node-title" fill="#9a4d13">转置视图</text>
    <text x="397" y="228" class="node-sub">shape [3,2]</text>
    <text x="397" y="248" class="node-sub">stride [1,3] · offset 0</text>
    <text x="397" y="270" font-size="12" font-weight="700" fill="#c2410c">非连续</text>

    <rect x="528" y="174" width="190" height="112" rx="14" fill="#fff7ed" stroke="#e8a765"/>
    <text x="623" y="203" class="node-title" fill="#9a4d13">切片视图</text>
    <text x="623" y="228" class="node-sub">shape [2,2]</text>
    <text x="623" y="248" class="node-sub">stride [3,1] · offset 1</text>
    <text x="623" y="270" font-size="12" font-weight="700" fill="#c2410c">跨行时非连续</text>
  </g>

  <rect x="92" y="354" width="610" height="126" rx="16" fill="#0f766e" filter="url(#shadow)"/>
  <path d="M171 286V350" class="ref"/>
  <path d="M397 286V350" class="ref"/>
  <path d="M623 286V350" class="ref"/>
  <text x="116" y="386" class="node-title" fill="#ffffff">共享存储</text>
  <text x="116" y="410" font-size="12" fill="#d9fffa">shared_ptr 保证任一视图存活时元素仍有效</text>
  <g text-anchor="middle" font-size="16" fill="#0f5f59">
    <rect x="116" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="151" y="452">1</text>
    <rect x="196" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="231" y="452">2</text>
    <rect x="276" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="311" y="452">3</text>
    <rect x="356" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="391" y="452">4</text>
    <rect x="436" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="471" y="452">5</text>
    <rect x="516" y="429" width="70" height="34" rx="8" fill="#f0fdfa"/><text x="551" y="452">6</text>
  </g>

  <rect x="92" y="510" width="610" height="82" rx="14" fill="#f8fafc" stroke="#d8e2e8"/>
  <text x="116" y="540" class="node-title" fill="#334155">同一物理元素，不同逻辑索引</text>
  <text x="116" y="566" class="note">地址 = offset + Σ(index[axis] × stride[axis])</text>

  <rect x="774" y="112" width="374" height="516" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="798" y="145" class="section" fill="#9a4d13">需要连续输入时显式物化</text>

  <rect x="806" y="182" width="310" height="92" rx="14" fill="#fff0dc" stroke="#e8a765"/>
  <text x="961" y="212" text-anchor="middle" class="node-title" fill="#9a4d13">转置视图的逻辑顺序</text>
  <text x="961" y="239" text-anchor="middle" class="node-sub">[1,4] [2,5] [3,6]</text>
  <text x="961" y="259" text-anchor="middle" class="node-sub">物理访问会跨 stride</text>

  <rect x="854" y="326" width="214" height="66" rx="14" fill="#c45b16" filter="url(#shadow)"/>
  <text x="961" y="355" text-anchor="middle" class="node-title" fill="#ffffff">contiguous()</text>
  <text x="961" y="378" text-anchor="middle" font-size="12" fill="#fff2e8">按逻辑索引复制</text>
  <path d="M961 274V326" class="flow"/>

  <rect x="806" y="446" width="310" height="132" rx="14" fill="#e7f6f3" stroke="#4a9d93"/>
  <text x="830" y="476" class="node-title" fill="#0f5f59">新的连续存储</text>
  <text x="830" y="501" class="node-sub">元素：[1,4,2,5,3,6]</text>
  <text x="830" y="526" class="node-sub">shape [3,2] · stride [2,1]</text>
  <text x="830" y="551" class="node-sub">offset 0 · 不再共享原存储</text>
  <path d="M961 392V446" class="flow"/>
</svg>
