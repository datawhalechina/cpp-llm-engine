<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 03 矩阵乘法的章内主线与扩展路线</title>
  <desc id="desc">Chapter 03 位于张量视图与解码器之间。A 教学基线和 B 真实 CPU 主线建立公共矩阵乘法契约，G 路线使用 CUDA 和 cuBLAS 实现同一契约，M 路线让视觉编码器和投影层复用相同算子语义。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #172033; }
      .section { font-size: 17px; font-weight: 700; fill: #172033; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #334155; }
      .small { font-size: 12px; fill: #64748b; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf7f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#background)"/>
  <text x="54" y="55" class="title">第 03 章：先固定矩阵乘法契约，再选择执行与输入扩展</text>
  <text x="54" y="84" class="body">A/B 建立 CPU 主线；G 替换执行后端；M 复用算子语义，不复制解码器与运行时</text>

  <rect x="54" y="112" width="1092" height="120" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="142" class="small" font-weight="700">在推理引擎中的位置</text>
  <g text-anchor="middle">
    <rect x="102" y="160" width="254" height="50" rx="12" fill="#e8f1f7"/>
    <text x="229" y="182" class="label" fill="#28536b">第 02 章</text>
    <text x="229" y="201" class="small">存储、张量与视图</text>

    <rect x="473" y="152" width="254" height="66" rx="13" fill="#0f766e" filter="url(#shadow)"/>
    <text x="600" y="180" class="label" fill="#ffffff">第 03 章</text>
    <text x="600" y="202" font-size="14" fill="#d9fffa">矩阵乘法、算子与后端</text>

    <rect x="844" y="160" width="254" height="50" rx="12" fill="#fff0dc"/>
    <text x="971" y="182" class="label" fill="#9a4d13">第 04 章</text>
    <text x="971" y="201" class="small">注意力、前馈网络与解码器</text>
  </g>
  <path d="M356 185 H463" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M727 185 H834" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="54" y="274" class="section">本章学习：两条 CPU 学习线建立契约，两条扩展线复用契约</text>

  <g>
    <rect x="54" y="302" width="278" height="88" rx="15" fill="#e8f1f7" stroke="#79a4ba"/>
    <text x="78" y="329" class="label" fill="#28536b">A　教学基线</text>
    <text x="78" y="352" class="body">固定小矩阵 · CPU 三重循环</text>
    <text x="78" y="374" class="small">直接复查 58 / 64 / 139 / 154</text>

    <rect x="54" y="414" width="278" height="88" rx="15" fill="#e7f6f3" stroke="#4d9d92"/>
    <text x="78" y="441" class="label" fill="#0f5f59">B　真实 CPU 主线</text>
    <text x="78" y="464" class="body">张量视图 → 矩阵乘法请求</text>
    <text x="78" y="486" class="small">连续性 · 失败传播 · 结果提交</text>
  </g>

  <rect x="420" y="334" width="360" height="136" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="600" y="367" text-anchor="middle" class="label" fill="#0f5f59">公共矩阵乘法契约</text>
  <text x="600" y="397" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">左输入 [M,K] × 右输入 [K,N]</text>
  <text x="600" y="425" text-anchor="middle" class="body">输出 [M,N] · 行优先 · Float32</text>
  <text x="600" y="449" text-anchor="middle" class="small">对照 CPU 数值基线 · 错误返回 Status</text>

  <g>
    <rect x="868" y="302" width="278" height="88" rx="15" fill="#fff0dc" stroke="#e8a765"/>
    <text x="892" y="329" class="label" fill="#9a4d13">G　GPU 执行扩展</text>
    <text x="892" y="352" class="body">设备内存 · CUDA Stream · cuBLAS</text>
    <text x="892" y="374" class="small">与 CPU reference 做数值对照</text>

    <rect x="868" y="414" width="278" height="88" rx="15" fill="#f4f7df" stroke="#9aa64a"/>
    <text x="892" y="441" class="label" fill="#59651e">M　多模态输入扩展</text>
    <text x="892" y="464" class="body">视觉线性层 · 投影层</text>
    <text x="892" y="486" class="small">复用形状语义，可选择 CPU 或 GPU</text>
  </g>

  <path d="M332 346 H390 Q408 346 420 366" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M332 458 H390 Q408 458 420 438" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M780 366 Q792 346 810 346 H858" fill="none" stroke="#e58b36" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M780 438 Q792 458 810 458 H858" fill="none" stroke="#8b993c" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
