<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 01 把模型文件和用户文本转换为内部对象</title>
  <desc id="desc">Chapter 01 使用 A 教学闭环验证小型权重文件与 Tokenizer 接口，使用 B 真实执行闭环读取 GGUF，使用 C 架构扩展交付稠密、MoE 与 MLA 权重布局。</desc>
  <defs>
    <style>text { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif !important; }</style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#28536b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c45b16"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="566" rx="24" fill="url(#background)"/>
  <text x="54" y="55" font-size="27" font-weight="700" fill="#172033">Chapter 01：把外部输入转换成可检查的内部对象</text>
  <text x="54" y="84" font-size="15" fill="#52606d">模型文件产生配置、权重和布局；用户文本产生词元编号</text>

  <!-- Position in the learning path -->
  <rect x="54" y="112" width="1092" height="124" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
  <text x="78" y="143" font-size="15" font-weight="700" fill="#52606d">在推理引擎中的位置</text>
  <g text-anchor="middle">
    <rect x="102" y="163" width="254" height="50" rx="12" fill="#fff0dc"/>
    <text x="229" y="185" font-size="15" font-weight="700" fill="#9a4d13">Chapter 00</text>
    <text x="229" y="203" font-size="13" fill="#8a5b32">真实模型推理基线</text>

    <rect x="473" y="155" width="254" height="66" rx="13" fill="#28536b" filter="url(#shadow)"/>
    <text x="600" y="183" font-size="16" font-weight="700" fill="#ffffff">Chapter 01</text>
    <text x="600" y="204" font-size="14" fill="#e8f6ff">输入、配置与权重布局</text>

    <rect x="844" y="163" width="254" height="50" rx="12" fill="#e7f6f3"/>
    <text x="971" y="185" font-size="15" font-weight="700" fill="#0f5f59">Chapter 02</text>
    <text x="971" y="203" font-size="13" fill="#376963">张量视图与共享存储</text>
  </g>
  <path d="M356 188 H473" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M727 188 H844" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Two evidence paths -->
  <text x="54" y="278" font-size="18" font-weight="700" fill="#172033">小输入验证接口，真实文件验证模型资产，架构布局连接执行层</text>
  <text x="1146" y="278" font-size="13" text-anchor="end" fill="#64748b">A 教学闭环 · B 真实执行闭环 · C 架构扩展</text>

  <g>
    <rect x="54" y="302" width="160" height="104" rx="15" fill="#e8f1f7" stroke="#93b6c8" stroke-width="2"/>
    <text x="134" y="333" font-size="15" font-weight="700" text-anchor="middle" fill="#28536b">B 真实模型文件</text>
    <text x="134" y="359" font-size="14" text-anchor="middle" fill="#172033">四类 GGUF 基线</text>
    <text x="134" y="383" font-size="12" text-anchor="middle" fill="#52606d">配置 · 目录 · 权重数据</text>

    <rect x="270" y="294" width="210" height="120" rx="16" fill="#ffffff" stroke="#79a4ba" stroke-width="2"/>
    <text x="375" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#28536b">读取、适配与校验</text>
    <text x="375" y="352" font-size="12" text-anchor="middle" fill="#52606d">GgufReader · Adapter</text>
    <text x="375" y="375" font-size="12" text-anchor="middle" fill="#52606d">GgufTensorLoader</text>
    <text x="375" y="397" font-size="12" text-anchor="middle" fill="#708090">检查名称、形状、类型和偏移</text>

    <rect x="536" y="294" width="244" height="120" rx="16" fill="#e8f1f7" stroke="#79a4ba"/>
    <text x="658" y="325" font-size="15" font-weight="700" text-anchor="middle" fill="#28536b">统一的内部对象</text>
    <text x="658" y="351" font-size="13" text-anchor="middle" fill="#172033">模型配置（ModelConfig）</text>
    <text x="658" y="375" font-size="13" text-anchor="middle" fill="#172033">权重张量映射（Tensor Map）</text>
    <text x="658" y="397" font-size="12" text-anchor="middle" fill="#52606d">分词器元数据</text>

    <rect x="836" y="302" width="310" height="104" rx="16" fill="#28536b" filter="url(#shadow)"/>
    <text x="991" y="333" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">B/C 交给真实解码器</text>
    <text x="991" y="360" font-size="13" text-anchor="middle" fill="#e8f6ff">稠密整体布局 · MoE/MLA 分层对象</text>
    <text x="991" y="384" font-size="12" text-anchor="middle" fill="#c9e8f5">Llama · Qwen3 · Qwen MoE · DeepSeek2</text>
  </g>

  <path d="M214 354 H270" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M480 354 H536" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M780 354 H836" fill="none" stroke="#28536b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <g>
    <rect x="54" y="452" width="160" height="82" rx="15" fill="#fff0dc" stroke="#e8a765" stroke-width="2"/>
    <text x="134" y="484" font-size="15" font-weight="700" text-anchor="middle" fill="#9a4d13">A 小型输入</text>
    <text x="134" y="511" font-size="12" text-anchor="middle" fill="#6f5438">CIE1 · 固定数据 · 文本</text>

    <rect x="270" y="452" width="210" height="82" rx="15" fill="#ffffff" stroke="#e8a765" stroke-width="2"/>
    <text x="375" y="484" font-size="15" font-weight="700" text-anchor="middle" fill="#9a4d13">加载器与分词器</text>
    <text x="375" y="511" font-size="12" text-anchor="middle" fill="#6f5438">固定正常路径与错误路径</text>

    <rect x="536" y="452" width="244" height="82" rx="15" fill="#fff0dc" stroke="#e8a765"/>
    <text x="658" y="484" font-size="15" font-weight="700" text-anchor="middle" fill="#9a4d13">可检查的教学对象</text>
    <text x="658" y="511" font-size="13" text-anchor="middle" fill="#6f5438">张量 · 词元编号 · 状态</text>

    <rect x="836" y="452" width="310" height="82" rx="15" fill="#e7f6f3" stroke="#0f766e" stroke-width="2"/>
    <text x="991" y="484" font-size="15" font-weight="700" text-anchor="middle" fill="#0f5f59">A 默认单元测试</text>
    <text x="991" y="511" font-size="12" text-anchor="middle" fill="#376963">字段 · 边界 · 坏文件拒绝</text>
  </g>

  <path d="M214 493 H270" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M480 493 H536" fill="none" stroke="#c45b16" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M780 493 H836" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

</svg>
