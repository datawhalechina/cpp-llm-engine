<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">推理策略从算法语义进入设备执行</title>
  <desc id="desc">量化线性层、在线注意力、分页缓存、连续批处理和前缀复用先建立算法语义与公共契约，再分别进入 CPU 参考执行和 CUDA 加速，最终由正确性测试、真实模型、A/B 实验与性能剖析验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f3f8f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .small { font: 400 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .code { font: 500 12px "JetBrains Mono", "SFMono-Regular", monospace; fill: #334155; }
      .inverse { font: 600 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <text x="52" y="54" class="title">推理策略：先固定语义，再替换设备执行</text>
  <text x="52" y="82" class="subtitle">章节实现负责把策略变成可观察对象；公共契约隔离设备差异；性能证据决定优化是否保留。</text>

  <text x="52" y="127" class="section">算法与系统语义</text>
  <g filter="url(#shadow)">
    <rect x="52" y="148" width="214" height="74" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="288" y="148" width="214" height="74" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="524" y="148" width="214" height="74" rx="14" fill="#ecfdf5" stroke="#86efac"/>
    <rect x="760" y="148" width="214" height="74" rx="14" fill="#ecfdf5" stroke="#86efac"/>
    <rect x="996" y="148" width="232" height="74" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  </g>
  <text x="159" y="178" text-anchor="middle" class="label">量化线性层</text>
  <text x="159" y="202" text-anchor="middle" class="small">权重布局 · 缩放 · 点积</text>
  <text x="395" y="178" text-anchor="middle" class="label">在线注意力</text>
  <text x="395" y="202" text-anchor="middle" class="small">分块 Softmax · 因果关系</text>
  <text x="631" y="178" text-anchor="middle" class="label">分页 K/V</text>
  <text x="631" y="202" text-anchor="middle" class="small">页表 · 事务 · 生命周期</text>
  <text x="867" y="178" text-anchor="middle" class="label">连续批处理</text>
  <text x="867" y="202" text-anchor="middle" class="small">预算 · 优先级 · 回滚</text>
  <text x="1112" y="178" text-anchor="middle" class="label">前缀复用</text>
  <text x="1112" y="202" text-anchor="middle" class="small">最长匹配 · 引用计数</text>

  <path d="M 159 222 L 159 257 L 640 257 L 640 282" class="soft-line"/>
  <path d="M 395 222 L 395 257" class="soft-line"/>
  <path d="M 631 222 L 631 257" class="soft-line"/>
  <path d="M 867 222 L 867 257" class="soft-line"/>
  <path d="M 1112 222 L 1112 257 L 640 257" class="soft-line"/>
  <path d="M 640 257 L 640 282" class="line"/>

  <g filter="url(#shadow)">
    <rect x="220" y="282" width="840" height="88" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <text x="640" y="315" text-anchor="middle" class="section">公共数据与执行契约</text>
  <text x="640" y="342" text-anchor="middle" class="code">Linear · Attention · BlockTable · ExecutorBatch · PrefixBlockStore</text>
  <text x="640" y="360" text-anchor="middle" class="small">形状、布局、所有权、请求状态与失败回滚保持一致</text>

  <path d="M 640 370 L 640 398 L 344 398 L 344 423" class="line"/>
  <path d="M 640 370 L 640 398 L 936 398 L 936 423" class="line"/>

  <g filter="url(#shadow)">
    <rect x="108" y="423" width="472" height="104" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="700" y="423" width="472" height="104" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <text x="344" y="458" text-anchor="middle" class="section">CPU 参考与批执行</text>
  <text x="344" y="485" text-anchor="middle" class="small">标量正确性 · 量化块解码 · 专家分组 · 请求调度</text>
  <text x="344" y="508" text-anchor="middle" class="code">Chapter04 · 05 · 07 · 08</text>
  <text x="936" y="458" text-anchor="middle" class="section">CUDA 数据面与融合执行</text>
  <text x="936" y="485" text-anchor="middle" class="small">设备内存 · 量化 GEMV · 分页 GQA · Tensor Batch</text>
  <text x="936" y="508" text-anchor="middle" class="code">code/cuda · Chapter09</text>

  <path d="M 344 527 L 344 552 L 640 552 L 640 574" class="soft-line"/>
  <path d="M 936 527 L 936 552 L 640 552" class="soft-line"/>
  <path d="M 640 552 L 640 574" class="line"/>
  <rect x="244" y="574" width="792" height="46" rx="14" fill="#172033"/>
  <text x="640" y="603" text-anchor="middle" class="inverse">正确性测试 → 真实模型 → A/B 实验 → 性能剖析 → KEEP / REJECT</text>
</svg>
