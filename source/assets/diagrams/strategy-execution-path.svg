<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">代表性推理策略从语义进入执行与验证</title>
  <desc id="desc">计算策略和系统策略先固定数值、状态和事务规则，再分别进入平台无关控制面、CPU 参考实现与 CUDA 数据面，最后由 Chapter09 建立正确性和性能证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f3e7"/><stop offset="1" stop-color="#e5f0ec"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173832" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496b64"/></marker>
    <style>
      .title{font:700 28px 'Noto Sans CJK SC',sans-serif;fill:#173832}.subtitle{font:500 15px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.group{font:700 14px 'Noto Sans CJK SC',sans-serif}.heading{font:700 16px 'Noto Sans CJK SC',sans-serif;fill:#173832}.small{font:500 12px 'Noto Sans CJK SC',sans-serif;fill:#5c716c}.code{font:500 12px 'JetBrains Mono',monospace;fill:#49615c}.inverse{fill:#fff}.box{stroke:#315650;stroke-width:1.6;rx:13;filter:url(#shadow)}.line{stroke:#66817b;stroke-width:1.9;fill:none;marker-end:url(#arrow)}.soft{stroke:#829892;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1280" height="650" fill="url(#bg)"/>
  <text x="50" y="50" class="title">代表性推理策略：先固定语义，再选择执行位置</text>
  <text x="50" y="78" class="subtitle">计算策略回答“怎样算”，系统策略回答“怎样组织请求与状态”；稳定规则让不同执行路径可以比较。</text>

  <rect x="50" y="103" width="570" height="28" rx="14" fill="#f5dfbf"/><text x="335" y="122" text-anchor="middle" class="group" fill="#8b5b20">计算策略 · 数值、布局与局部执行</text>
  <rect x="660" y="103" width="570" height="28" rx="14" fill="#dcece3"/><text x="945" y="122" text-anchor="middle" class="group" fill="#276052">系统策略 · 请求、缓存与资源状态</text>

  <rect x="50" y="148" width="174" height="76" class="box" fill="#fff2de"/><text x="137" y="178" text-anchor="middle" class="heading">量化 Linear</text><text x="137" y="202" text-anchor="middle" class="small">格式 · scale · 点积</text>
  <rect x="246" y="148" width="174" height="76" class="box" fill="#fff2de"/><text x="333" y="178" text-anchor="middle" class="heading">在线 Attention</text><text x="333" y="202" text-anchor="middle" class="small">分块 Softmax · 因果</text>
  <rect x="442" y="148" width="178" height="76" class="box" fill="#fff2de"/><text x="531" y="178" text-anchor="middle" class="heading">MLA / MoE</text><text x="531" y="202" text-anchor="middle" class="small">压缩状态 · 专家路由</text>
  <rect x="660" y="148" width="174" height="76" class="box" fill="#e9f5ee"/><text x="747" y="178" text-anchor="middle" class="heading">分页 K/V</text><text x="747" y="202" text-anchor="middle" class="small">块表 · 事务 · 回收</text>
  <rect x="856" y="148" width="174" height="76" class="box" fill="#e9f5ee"/><text x="943" y="178" text-anchor="middle" class="heading">连续批处理</text><text x="943" y="202" text-anchor="middle" class="small">预算 · 选择 · 回滚</text>
  <rect x="1052" y="148" width="178" height="76" class="box" fill="#e9f5ee"/><text x="1141" y="178" text-anchor="middle" class="heading">Radix Cache</text><text x="1141" y="202" text-anchor="middle" class="small">最长匹配 · 引用计数</text>

  <path d="M137 224V250H640M333 224V250M531 224V250M747 224V250M943 224V250M1141 224V250H640" class="soft"/>
  <path d="M640 250V273" class="line"/>

  <rect x="215" y="273" width="850" height="88" class="box" fill="#f7fbf9" stroke="#4f8277"/>
  <text x="640" y="305" text-anchor="middle" class="heading">稳定契约与状态规则</text>
  <text x="640" y="330" text-anchor="middle" class="code">shape · layout · ownership · request state · reserve / commit / rollback</text>
  <text x="640" y="350" text-anchor="middle" class="small">不同策略共享验证原则，但通过各自接口进入对应实现</text>

  <path d="M640 361V390H210V418" class="line"/><path d="M640 361V418" class="line"/><path d="M640 390H1070V418" class="line"/>

  <rect x="50" y="418" width="320" height="112" class="box" fill="#e7f2e9"/>
  <text x="210" y="450" text-anchor="middle" class="heading">平台无关控制面</text><text x="210" y="476" text-anchor="middle" class="small">BlockTable · Scheduler · Prefix Store</text><text x="210" y="499" text-anchor="middle" class="small">选择工作、预留资源、提交或回滚</text><text x="210" y="519" text-anchor="middle" class="code">Chapter07 · 08</text>
  <rect x="480" y="418" width="320" height="112" class="box" fill="#fff2de"/>
  <text x="640" y="450" text-anchor="middle" class="heading">CPU 参考与批执行</text><text x="640" y="476" text-anchor="middle" class="small">标量公式 · 量化 block · 在线 Softmax</text><text x="640" y="499" text-anchor="middle" class="small">固定正确性，并提供可运行算法语义</text><text x="640" y="519" text-anchor="middle" class="code">Chapter04 · 05 · model</text>
  <rect x="910" y="418" width="320" height="112" class="box" fill="#e4eef9"/>
  <text x="1070" y="450" text-anchor="middle" class="heading">CUDA 数据面</text><text x="1070" y="476" text-anchor="middle" class="small">设备内存 · 融合 Kernel · 分页读取</text><text x="1070" y="499" text-anchor="middle" class="small">量化 GEMV · GQA/MLA · MoE 批执行</text><text x="1070" y="519" text-anchor="middle" class="code">code/cuda · model · engine</text>

  <path d="M210 530V558H640M640 530V558M1070 530V558H640" class="soft"/><path d="M640 558V575" class="line"/>
  <rect x="180" y="575" width="920" height="48" rx="16" fill="#173832"/>
  <text x="640" y="605" text-anchor="middle" class="heading inverse">Chapter09：正确性 → 真实模型 → 配对实验 → 性能剖析 → 保留或调整</text>
</svg>
